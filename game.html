<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VT Basketball Game Report</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .custom-green-100 { background-color: #00A327; }
        .custom-green-50 { background-color: #66C47E; }
        .custom-red-50 { background-color: #E06060; }
        .custom-red-100 { background-color: #DB2800; }
    </style>
    <script type="module" src="firebase.js"></script>
    <script src="config.js"></script>
    <script src="lineup-core.js"></script>
    <script src="play-log.js"></script>
</head>
<body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
    <script type="text/babel" src="ui.jsx"></script>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const C = window.LineupCore;
        const CFG = window.VT_CONFIG;
        const { PageHeader, Card, Toggle, StatsTable, PlayerList, Warnings, useSort, useAvailability, UsageTable, ShotChart, TeamLogo } = window.UI;

        // Everything for one game. Click a player (usage table or shot chart) or a lineup to filter the rest of the page.
        const GameReport = () => {
            const [darkMode, setDarkMode] = useState(true);
            const [selectedGame, setSelectedGame] = useState(() => (location.hash || '').slice(1));
            const [allInfo, setAllInfo] = useState(null);
            const [info, setInfo] = useState(null);
            const [raw, setRaw] = useState(null);
            const [includeGarbageTime, setIncludeGarbageTime] = useState(true);
            const [periodsOff, setPeriodsOff] = useState([]);
            const [player, setPlayer] = useState('all');
            const [lineupSel, setLineupSel] = useState(null);
            const sort = useSort('plusMinus');
            const { availability, toggle, isAvailable } = useAvailability();

            // Default to the game in the link, else the most recent game with data.
            useEffect(() => {
                C.db().then(db => db.read('game-info')).then(all => {
                    setAllInfo(all || {});
                    if (selectedGame && CFG.findGame(selectedGame)) return;
                    const withData = CFG.allGames().filter(g => all?.[g.date]?.started);
                    setSelectedGame((withData[withData.length - 1] || CFG.allGames()[0])?.date || '');
                });
            }, []);
            useEffect(() => { if (selectedGame) history.replaceState(null, '', `#${selectedGame}`); }, [selectedGame]);

            useEffect(() => {
                if (!selectedGame) return;
                setPeriodsOff([]); setPlayer('all'); setLineupSel(null);
                let u1;
                C.db().then(db => { u1 = db.watch(`game-info/${selectedGame}`, setInfo); });
                return () => { u1 && u1(); setInfo(null); setRaw(null); };
            }, [selectedGame]);
            const format = info?.format === 2 ? 2 : 1;
            useEffect(() => {
                if (!selectedGame || !info) return;
                let u2;
                C.db().then(db => { u2 = db.watch(C.dataPath(info, selectedGame), setRaw); });
                return () => { u2 && u2(); };
            }, [selectedGame, format, !!info]);

            const roster = useMemo(() => CFG.rosterForDate(selectedGame), [selectedGame]);
            const game = CFG.findGame(selectedGame);
            const opponent = game?.opponent || info?.opponent || 'Opponent';
            const v2 = format === 2;
            const periods = v2 ? (info?.periods || []) : [];
            const built = useMemo(() => C.buildGame(info, raw, roster), [info, raw, roster]);

            const inPeriod = (p) => !v2 || !periodsOff.includes(p);
            const counted = built.segments.filter(s => (includeGarbageTime || !s.isGarbageTime) && inPeriod(s.period));
            const lineupKey = (ids) => [...ids].sort((a, b) => a - b).join('-');

            const allRows = C.aggregateLineups(counted.filter(s => s.lineup.every(isAvailable)), roster);
            const rows = player === 'all' ? allRows : allRows.filter(r => r.playerIds.includes(+player));
            const totals = C.playerTotals(counted);
            const usage = C.usageRows(counted, roster);
            const shots = built.shots.filter(s => (includeGarbageTime || !s.garbage) && inPeriod(s.period) && (!lineupSel || lineupKey(s.lineup) === lineupSel));
            const selectedLineupNames = lineupSel ? allRows.find(r => r.id === lineupSel)?.names : null;

            // Full game total: every section added together, even if the scoreboard was reset during an exhibition.
            const score = v2 ? built.score : null;
            const endRecord = v2 ? null : C.historyList(raw).find(r => r.changes === 'End of Game');
            const finalVt = v2 ? score.vt : info?.finalVtScore ?? endRecord?.vtScore;
            const finalOpp = v2 ? score.opp : info?.finalOppScore ?? endRecord?.oppScore;
            const status = !info?.started ? '' : !info.ended ? 'In progress' : finalVt > finalOpp ? 'Win' : finalVt < finalOpp ? 'Loss' : 'Final';

            const textMain = darkMode ? 'text-white' : 'text-gray-900';
            const textSub = darkMode ? 'text-gray-400' : 'text-gray-500';
            const chip = `inline-flex items-center gap-2 px-3 py-1 rounded-full text-sm ${darkMode ? 'bg-gray-700 text-white' : 'bg-orange-100 text-orange-900'}`;
            const pickPlayer = (id) => { setPlayer(id === 'all' || +player === +id ? 'all' : +id); };

            return (
                <div className={`min-h-screen ${darkMode ? 'bg-gray-900' : 'bg-gray-100'}`}>
                    <PageHeader title="Game Report" current="game.html" darkMode={darkMode} setDarkMode={setDarkMode}>
                        <div className="flex flex-wrap justify-end items-center gap-4">
                            <select value={selectedGame} onChange={(e) => setSelectedGame(e.target.value)}
                                className={`px-3 py-2 border rounded-md ${darkMode ? 'bg-gray-800 border-gray-600 text-white' : 'bg-white border-gray-300 text-gray-900'}`}>
                                {CFG.seasonKeys.map(key => (
                                    <optgroup key={key} label={CFG.SEASONS[key].label}>
                                        {CFG.gamesForSeason(key).map(g => (
                                            <option key={g.date} value={g.date}>
                                                {g.displayName}{g.exhibition ? ' (exh)' : ''}{allInfo && !allInfo[g.date]?.started ? ' — no data' : ''}
                                            </option>
                                        ))}
                                    </optgroup>
                                ))}
                            </select>
                            <Toggle label="Garbage Time" value={includeGarbageTime} onChange={setIncludeGarbageTime} darkMode={darkMode} />
                        </div>
                        {periods.length > 1 && (
                            <div className={`flex flex-wrap justify-end items-center gap-3 mt-3 text-sm ${darkMode ? 'text-gray-300' : 'text-gray-700'}`}>
                                <span>Periods counted:</span>
                                {periods.map((p, i) => (
                                    <label key={i} className="flex items-center gap-1 cursor-pointer">
                                        <input type="checkbox" checked={!periodsOff.includes(i + 1)}
                                            onChange={() => setPeriodsOff(off => off.includes(i + 1) ? off.filter(x => x !== i + 1) : [...off, i + 1])} />
                                        {p.label} ({p.endClock === undefined ? 'in progress' : C.formatSeconds(p.length - p.endClock)})
                                    </label>
                                ))}
                            </div>
                        )}
                    </PageHeader>

                    {!info?.started ? (
                        <div className={`m-4 rounded-lg shadow p-8 text-center text-xl ${darkMode ? 'bg-gray-800' : 'bg-white'} ${textSub}`}>No data recorded for this game</div>
                    ) : (
                        <div className="flex">
                            <div className={`w-64 p-4 border-r shrink-0 ${darkMode ? 'bg-gray-800 border-gray-700' : 'bg-white border-gray-300'}`}>
                                <PlayerList players={roster} totals={totals} availability={availability} onToggle={toggle} darkMode={darkMode} />
                            </div>
                            <div className="flex-1 p-4 grid gap-4 content-start min-w-0">
                                <div className="flex flex-wrap items-center gap-4">
                                    <div className="flex items-center gap-2">
                                        <TeamLogo name="Virginia Tech" size={40} />
                                        <span className={`text-3xl font-bold ${textMain}`} style={{ fontVariantNumeric: 'tabular-nums' }}>{finalVt ?? '–'} – {finalOpp ?? '–'}</span>
                                        <TeamLogo name={opponent} size={40} />
                                    </div>
                                    <div className={textSub}>{game?.displayName}{game?.exhibition ? ' · exhibition' : ''} · {status}{v2 ? ` · ${built.possessions.vt} possessions` : ''}</div>
                                    {v2 && periods.length > 1 && (
                                        <div className={`flex flex-wrap gap-3 text-sm ${textSub}`} title="Points scored in each section">
                                            {periods.map((p, i) => {
                                                const ps = built.periodScores[i + 1] || { vt: 0, opp: 0 };
                                                return <span key={i} className={periodsOff.includes(i + 1) ? 'line-through opacity-60' : ''}>{p.label} <b className={textMain}>{ps.vt}–{ps.opp}</b></span>;
                                            })}
                                        </div>
                                    )}
                                    {player !== 'all' && <span className={chip}>Player: {roster.find(p => p.id === +player)?.name}<button onClick={() => setPlayer('all')} aria-label="Clear player">✕</button></span>}
                                    {lineupSel && <span className={chip}>Shots with: {selectedLineupNames}<button onClick={() => setLineupSel(null)} aria-label="Clear lineup">✕</button></span>}
                                </div>
                                <Warnings warnings={built.warnings} darkMode={darkMode} />

                                <Card darkMode={darkMode} title="Lineups" right={v2 ? 'Click a lineup to see the shots taken while it was on the floor' : null}>
                                    <StatsTable rows={rows} darkMode={darkMode} emptyText="No lineup data for this selection" {...sort}
                                        onRowClick={v2 ? (r) => setLineupSel(lineupSel === r.id ? null : r.id) : undefined} selectedId={lineupSel} />
                                </Card>

                                {v2 ? (
                                    <div className="grid gap-4" style={{ gridTemplateColumns: 'repeat(auto-fit, minmax(560px, 1fr))' }}>
                                        <Card darkMode={darkMode} title="Shot chart">
                                            <ShotChart shots={shots} roster={roster} darkMode={darkMode} player={player} onPlayer={pickPlayer}
                                                caption={lineupSel ? `Only shots taken with ${selectedLineupNames} on the floor.` : null} />
                                        </Card>
                                        <Card darkMode={darkMode} title="Usage" right="Click a player to filter the lineups and shot chart">
                                            <UsageTable usage={usage} darkMode={darkMode} selectedId={player} onRowClick={pickPlayer} />
                                        </Card>
                                    </div>
                                ) : (
                                    <div className={`text-sm ${textSub}`}>Usage and shot charts start with the 2026-27 season, when shot tracking began.</div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<GameReport />);
    </script>
</body>
</html>
