<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VT Basketball Game Viewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .custom-green-100 { background-color: #00A327; }
        .custom-green-50 { background-color: #66C47E; }
        .custom-red-50 { background-color: #E06060; }
        .custom-red-100 { background-color: #DB2800; }
    </style>
    <script type="module" src="firebase.js"></script>
    <script src="config.js"></script>
    <script src="lineup-core.js"></script>
</head>
<body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
    <script type="text/babel" src="ui.jsx"></script>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const C = window.LineupCore;
        const CFG = window.VT_CONFIG;
        const { Nav, DarkToggle, Toggle, StatsTable, PlayerList, Warnings, useSort, useAvailability } = window.UI;

        const SingleGameViewer = () => {
            const [darkMode, setDarkMode] = useState(true);
            const [selectedGame, setSelectedGame] = useState('');
            const [allInfo, setAllInfo] = useState(null);
            const [info, setInfo] = useState(null);
            const [rawHistory, setRawHistory] = useState(null);
            const [includeGarbageTime, setIncludeGarbageTime] = useState(true);
            const sort = useSort('plusMinus');
            const { availability, toggle, isAvailable } = useAvailability();

            // Default to the most recent game that has data.
            useEffect(() => {
                C.db().then(db => db.read('game-info')).then(all => {
                    setAllInfo(all || {});
                    const withData = CFG.allGames().filter(g => all?.[g.date]?.started);
                    const fallback = CFG.allGames()[0];
                    setSelectedGame((withData[withData.length - 1] || fallback)?.date || '');
                });
            }, []);

            useEffect(() => {
                if (!selectedGame) return;
                let u1, u2;
                C.db().then(db => {
                    u1 = db.watch(`game-info/${selectedGame}`, setInfo);
                    u2 = db.watch(`lineup-changes/${selectedGame}`, setRawHistory);
                });
                return () => { u1 && u1(); u2 && u2(); setInfo(null); setRawHistory(null); };
            }, [selectedGame]);

            const roster = useMemo(() => CFG.rosterForDate(selectedGame), [selectedGame]);
            const game = CFG.findGame(selectedGame);

            const { segments, warnings } = useMemo(
                () => C.buildSegments(rawHistory, roster, { startingLineup: info?.startingLineup }),
                [rawHistory, roster, info?.startingLineup]
            );
            const counted = segments.filter(s => includeGarbageTime || !s.isGarbageTime);
            const rows = C.aggregateLineups(counted.filter(s => s.lineup.every(isAvailable)), roster);
            const totals = C.playerTotals(counted);
            const result = C.gameResult(rawHistory, info);
            const hasGarbage = segments.some(s => s.isGarbageTime);

            const textMain = darkMode ? 'text-white' : 'text-gray-900';
            const textSub = darkMode ? 'text-gray-400' : 'text-gray-500';
            const endRecord = C.historyList(rawHistory).find(r => r.changes === 'End of Game');
            const finalScore = info?.finalVtScore !== undefined ? `${info.finalVtScore}-${info.finalOppScore}`
                : endRecord ? `${endRecord.vtScore}-${endRecord.oppScore}` : null;

            return (
                <div className={`min-h-screen ${darkMode ? 'bg-gray-900' : 'bg-gray-100'}`}>
                    <div className={`p-4 border-b ${darkMode ? 'border-gray-700' : 'border-gray-300'}`}>
                        <div className="flex flex-wrap justify-between items-center gap-3 mb-4">
                            <h1 className={`text-2xl font-bold ${textMain}`}>VT Basketball Game Viewer</h1>
                            <div className="flex items-center gap-3">
                                <Nav current="game.html" darkMode={darkMode} />
                                <DarkToggle darkMode={darkMode} setDarkMode={setDarkMode} />
                            </div>
                        </div>
                        <div className="flex flex-wrap justify-end items-center gap-4">
                            <select value={selectedGame} onChange={(e) => setSelectedGame(e.target.value)}
                                className={`px-3 py-2 border rounded-md ${darkMode ? 'bg-gray-800 border-gray-600 text-white' : 'bg-white border-gray-300 text-gray-900'}`}>
                                {CFG.seasonKeys.map(key => (
                                    <optgroup key={key} label={CFG.SEASONS[key].label}>
                                        {CFG.gamesForSeason(key).map(g => (
                                            <option key={g.date} value={g.date}>
                                                {g.displayName}{g.exhibition ? ' (exh)' : ''}{allInfo && !allInfo[g.date]?.started ? ' — no data' : ''}
                                            </option>
                                        ))}
                                    </optgroup>
                                ))}
                            </select>
                            <Toggle label="Garbage Time" value={includeGarbageTime} onChange={setIncludeGarbageTime} darkMode={darkMode} />
                        </div>
                    </div>

                    <div className="flex">
                        <div className={`w-64 p-4 border-r ${darkMode ? 'bg-gray-800 border-gray-700' : 'bg-white border-gray-300'}`}>
                            <PlayerList players={roster} totals={totals} availability={availability} onToggle={toggle} darkMode={darkMode} />
                        </div>
                        <div className="flex-1 p-4">
                            <Warnings warnings={warnings} darkMode={darkMode} />
                            {!info?.started ? (
                                <div className={`rounded-lg shadow p-8 text-center text-xl ${darkMode ? 'bg-gray-800' : 'bg-white'} ${textSub}`}>No data recorded for this game</div>
                            ) : (
                                <div className={`rounded-lg shadow p-4 ${darkMode ? 'bg-gray-800' : 'bg-white'}`}>
                                    <div className="flex flex-wrap items-baseline justify-between gap-2 mb-4">
                                        <h3 className={`text-lg font-semibold ${textMain}`}>Lineup Analytics — {game?.displayName || selectedGame}</h3>
                                        <div className={`text-sm ${textSub}`}>
                                            {!info.ended ? 'Game in progress' : result ? `${result === 'W' ? 'Win' : 'Loss'} ${finalScore || ''}` : 'Final'}
                                            {hasGarbage && !includeGarbageTime ? ' · garbage time excluded' : ''}
                                        </div>
                                    </div>
                                    <StatsTable rows={rows} darkMode={darkMode} emptyText="No lineup data available for this game" {...sort} />
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<SingleGameViewer />);
    </script>
</body>
</html>
