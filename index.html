<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VT Basketball Lineup Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="firebase.js"></script>
    <script src="config.js"></script>
    <script src="lineup-core.js"></script>
</head>
<body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const C = window.LineupCore;
        const CFG = window.VT_CONFIG;

        const seasonGames = CFG.gamesForSeason(CFG.CURRENT_SEASON);

        const todayLocalYMD = () => {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        };

        const defaultGameDate = (() => {
            if (seasonGames.length === 0) return '';
            const today = todayLocalYMD();
            const next = seasonGames.find(g => g.date >= today);
            return next ? next.date : seasonGames[seasonGames.length - 1].date;
        })();

        const TIME_RE = /^\d{1,2}:\d{2}$/;

        const BasketballLineupTracker = () => {
            const [darkMode, setDarkMode] = useState(false);
            const [online, setOnline] = useState(true);
            const [selectedGame, setSelectedGame] = useState(defaultGameDate);
            const [gameStarted, setGameStarted] = useState(false);
            const [currentHalf, setCurrentHalf] = useState(1);
            const [gameTime, setGameTime] = useState('20:00');
            const [currentLineup, setCurrentLineup] = useState([]);
            const [previousLineup, setPreviousLineup] = useState([]);
            const [startingLineup, setStartingLineup] = useState([]);
            const [pendingChanges, setPendingChanges] = useState([]);
            // null | 'startLineup' | 'start2nd' | 'subTime' | 'garbageTime'
            const [modal, setModal] = useState(null);
            const [pendingGameTime, setPendingGameTime] = useState('');
            const [vtScore, setVtScore] = useState(0);
            const [oppScore, setOppScore] = useState(0);
            const [lineupHistory, setLineupHistory] = useState([]);
            const [currentStats, setCurrentStats] = useState(C.EMPTY_STATS());
            const [garbageMarked, setGarbageMarked] = useState(false);

            const roster = useMemo(() => CFG.rosterForDate(selectedGame), [selectedGame]);
            const defaultLineup = useMemo(() => roster.slice(0, 5).map(p => p.id), [roster]);
            const currentOpponent = CFG.findGame(selectedGame)?.opponent || 'Opponent';
            const names = (ids) => C.idsToNames(ids, roster);
            const playerName = (id) => roster.find(p => p.id === id)?.name;
            const label = C.periodLabel(currentHalf);

            const path = (root) => `${root}/${selectedGame}`;

            useEffect(() => {
                document.body.className = darkMode ? 'bg-gray-900' : 'bg-gray-100';
            }, [darkMode]);

            // Connection indicator. Writes made while offline are queued and sent on reconnect,
            // as long as this page isn't reloaded in the meantime.
            useEffect(() => {
                let unsub;
                C.db().then(db => { unsub = db.watch('.info/connected', v => setOnline(v === true)); });
                return () => unsub && unsub();
            }, []);

            const resetLocal = () => {
                setGameStarted(false);
                setCurrentHalf(1);
                setGameTime('20:00');
                setCurrentLineup(defaultLineup);
                setPreviousLineup(defaultLineup);
                setStartingLineup(defaultLineup);
                setPendingChanges([]);
                setVtScore(0);
                setOppScore(0);
                setLineupHistory([]);
                setCurrentStats(C.EMPTY_STATS());
                setGarbageMarked(false);
                setModal(null);
            };

            // Load (or resume) the selected game.
            useEffect(() => {
                if (!selectedGame) return;
                let cancelled = false;
                (async () => {
                    const db = await C.db();
                    const info = await db.read(path('game-info'));
                    if (cancelled) return;
                    if (!info?.started || info.ended) { resetLocal(); return; }

                    const [rawHist, live, stats] = await Promise.all([
                        db.read(path('lineup-changes')), db.read(path('live-game')), db.read(path('current-stats'))
                    ]);
                    if (cancelled) return;
                    const hist = C.historyList(rawHist);
                    const lineup = C.namesToIds(info.currentLineup, roster);
                    const starters = C.namesToIds(info.startingLineup, roster);

                    setGameStarted(true);
                    setCurrentHalf(info.currentHalf || 1);
                    setGameTime(info.gameTime || '20:00');
                    setCurrentLineup(lineup.length === 5 ? lineup : defaultLineup);
                    setPreviousLineup(lineup.length === 5 ? lineup : defaultLineup);
                    setStartingLineup(starters.length === 5 ? starters : defaultLineup);
                    setPendingChanges([]);
                    setVtScore(live?.vtScore ?? info.vtScore ?? 0);
                    setOppScore(live?.oppScore ?? info.oppScore ?? 0);
                    setCurrentStats(stats || C.EMPTY_STATS());
                    setLineupHistory(hist);
                    setGarbageMarked(hist.some(r => r.garbageTime));

                    // Reloaded during halftime: go straight back to the 2nd-half lineup picker.
                    const last = C.sortHistory(hist).slice(-1)[0];
                    if (last?.changes === 'End of 1st Half') {
                        setCurrentLineup(starters.length === 5 ? starters : defaultLineup);
                        setModal('start2nd');
                    } else {
                        setModal(null);
                    }
                })();
                return () => { cancelled = true; };
            }, [selectedGame]);

            // ---- Firebase writes ----
            // Writes are NOT awaited: Firebase only resolves them once the server confirms, so
            // awaiting would freeze the screen whenever the wifi drops. The SDK queues them in
            // order and sends them when the connection comes back.

            const [writeError, setWriteError] = useState(null);
            const db = () => window.firebaseDb;
            const send = (promise) => {
                promise.catch(err => {
                    console.error('Firebase write failed:', err);
                    setWriteError(err.message || String(err));
                });
            };

            const appendRecords = (records) => {
                setLineupHistory(h => [...h, ...records]);
                // push() adds each record under its own key, so a second device can't overwrite them.
                records.forEach(r => send(db().push(db().ref(path('lineup-changes')), r)));
            };

            // lastUpdated lets the live dashboard ignore games that were started but never ended.
            const writeGameState = (fields) => {
                const stamped = { ...fields, lastUpdated: new Date().toISOString() };
                send(db().update(db().ref(path('game-info')), stamped));
                send(db().update(db().ref(path('live-game')), stamped));
            };

            const resetSegmentStats = () => {
                const fresh = C.EMPTY_STATS();
                setCurrentStats(fresh);
                send(db().set(db().ref(path('current-stats')), fresh));
            };

            const makeRecord = (time, changes, extra = {}) => ({
                timestamp: time,
                gameTime: time,
                vtScore,
                oppScore,
                changes,
                previousLineup: names(previousLineup),
                newLineup: names(currentLineup),
                half: currentHalf,
                completedSegmentStats: currentStats,
                ...extra
            });

            // ---- score & stats ----

            const updateScore = (team, points) => {
                if (!gameStarted) return;
                const newVt = team === 'vt' ? Math.max(0, vtScore + points) : vtScore;
                const newOpp = team === 'opponent' ? Math.max(0, oppScore + points) : oppScore;
                setVtScore(newVt);
                setOppScore(newOpp);
                writeGameState({ vtScore: newVt, oppScore: newOpp });
            };

            const updateStat = (team, statName, delta) => {
                if (!gameStarted) return;
                const newStats = {
                    ...currentStats,
                    [team]: { ...currentStats[team], [statName]: Math.max(0, currentStats[team][statName] + delta) }
                };
                setCurrentStats(newStats);
                send(db().set(db().ref(path('current-stats')), newStats));
            };

            // ---- game start / end ----

            const startGame = async () => {
                if (!selectedGame) return;
                let info = null;
                try {
                    info = await db().read(path('game-info'));
                } catch (err) {
                    alert(`Couldn't check this game for existing data (${err.message}). Check the connection and try again.`);
                    return;
                }
                if (info?.started) {
                    const ok = window.confirm(
                        `Warning: this game (${selectedGame}) already has data!\n\n` +
                        `Started: ${info.startTime ? new Date(info.startTime).toLocaleString() : 'Unknown'}\n` +
                        `Score: ${info.vtScore || 0}-${info.oppScore || 0}\n\n` +
                        `Starting a new game will OVERWRITE all existing data.\n\nContinue?`
                    );
                    if (!ok) return;
                }
                setCurrentLineup(defaultLineup);
                setModal('startLineup');
            };

            const confirmStartGame = () => {
                const starters = names(currentLineup);
                resetLocal();
                setGameStarted(true);
                setCurrentLineup([...currentLineup]);
                setPreviousLineup([...currentLineup]);
                setStartingLineup([...currentLineup]);

                send(db().remove(db().ref(path('lineup-changes'))));
                send(db().remove(db().ref(path('player-stats'))));
                send(db().set(db().ref(path('current-stats')), C.EMPTY_STATS()));
                send(db().set(db().ref(path('game-info')), {
                    started: true,
                    ended: false,
                    season: CFG.CURRENT_SEASON,
                    opponent: currentOpponent,
                    currentHalf: 1,
                    gameTime: '20:00',
                    vtScore: 0,
                    oppScore: 0,
                    currentLineup: starters,
                    startingLineup: starters,
                    startTime: new Date().toISOString(),
                    lastUpdated: new Date().toISOString()
                }));
                send(db().set(db().ref(path('live-game')), {
                    vtScore: 0, oppScore: 0, gameTime: '20:00', currentHalf: 1,
                    currentLineup: starters, lastUpdated: new Date().toISOString()
                }));
            };

            const blockIfPending = () => {
                if (pendingChanges.length > 0) {
                    alert('Confirm or cancel the pending substitutions first.');
                    return true;
                }
                return false;
            };

            const endGame = async () => {
                if (blockIfPending()) return;
                const ok = window.confirm(
                    `Are you sure you want to END this game?\n\n` +
                    `Score: VT ${vtScore} - ${currentOpponent} ${oppScore}\n` +
                    `Period: ${label}\n\nThis finalizes the game.`
                );
                if (!ok) return;

                appendRecords([makeRecord(`0:00 ${label}`, 'End of Game')]);
                send(db().update(db().ref(path('game-info')), {
                    ended: true,
                    endTime: new Date().toISOString(),
                    vtScore, oppScore,
                    finalVtScore: vtScore,
                    finalOppScore: oppScore
                }));
                resetLocal();
            };

            // ---- periods ----

            const endPeriod = async () => {
                if (blockIfPending()) return;

                if (currentHalf === 1) {
                    if (!window.confirm('End the 1st half?')) return;
                    appendRecords([makeRecord('0:00 1st', 'End of 1st Half', { previousLineup: names(currentLineup) })]);
                    resetSegmentStats();
                    setCurrentLineup([...startingLineup]);
                    setModal('start2nd');
                    return;
                }

                const next = currentHalf + 1;
                const nextLabel = C.periodLabel(next);
                const endName = currentHalf === 2 ? 'End of 2nd Half' : `End of ${label}`;
                if (!window.confirm(`${endName} — start ${nextLabel}?`)) return;

                const lineupNames = names(currentLineup);
                appendRecords([
                    makeRecord(`0:00 ${label}`, endName, { previousLineup: lineupNames }),
                    {
                        ...makeRecord(`5:00 ${nextLabel}`, `Start of ${nextLabel}`, { previousLineup: lineupNames, half: next }),
                        completedSegmentStats: C.EMPTY_STATS()
                    }
                ]);
                resetSegmentStats();
                setPreviousLineup([...currentLineup]);
                setCurrentHalf(next);
                setGameTime('5:00');
                writeGameState({ currentHalf: next, gameTime: '5:00' });
            };

            const confirmStart2ndHalf = () => {
                const endOfFirst = C.sortHistory(lineupHistory).slice(-1)[0];
                appendRecords([{
                    ...makeRecord('20:00 2nd', 'Start of 2nd Half', {
                        previousLineup: endOfFirst?.newLineup || names(currentLineup),
                        half: 2
                    }),
                    completedSegmentStats: C.EMPTY_STATS()
                }]);
                setPreviousLineup([...currentLineup]);
                setCurrentHalf(2);
                setGameTime('20:00');
                setModal(null);
                writeGameState({ currentLineup: names(currentLineup), currentHalf: 2, gameTime: '20:00' });
            };

            // ---- substitutions ----

            const handleLineupChange = (positionIndex, newPlayerId) => {
                newPlayerId = parseInt(newPlayerId, 10);
                if (newPlayerId === currentLineup[positionIndex]) return;
                if (pendingChanges.length === 0) setPreviousLineup([...currentLineup]);

                const oldPlayerId = currentLineup[positionIndex];
                const existing = pendingChanges.findIndex(c => c.positionIndex === positionIndex);
                const next = [...pendingChanges];
                if (existing !== -1) {
                    // Keep the original player who left this spot.
                    next[existing] = { ...next[existing], newPlayerId };
                    if (next[existing].oldPlayerId === newPlayerId) next.splice(existing, 1);
                } else {
                    next.push({ positionIndex, oldPlayerId, newPlayerId });
                }
                setPendingChanges(next);

                const newLineup = [...currentLineup];
                newLineup[positionIndex] = newPlayerId;
                setCurrentLineup(newLineup);
            };

            const handleStartingLineupChange = (positionIndex, newPlayerId) => {
                const newLineup = [...currentLineup];
                newLineup[positionIndex] = parseInt(newPlayerId, 10);
                setCurrentLineup(newLineup);
            };

            const cancelChanges = () => {
                setCurrentLineup([...previousLineup]);
                setPendingChanges([]);
            };

            // Returns the full time string ('15:42 1st') or null if the entry was rejected.
            const validateTime = () => {
                if (!TIME_RE.test(pendingGameTime)) {
                    alert('Use M:SS or MM:SS format (e.g. 4:22 or 15:42).');
                    return null;
                }
                const [m, s] = pendingGameTime.split(':').map(Number);
                if (s > 59) { alert('Seconds must be between 00 and 59.'); return null; }
                if (m * 60 + s > C.periodLength(currentHalf)) {
                    alert(`Time can't be more than ${C.periodLength(currentHalf) / 60}:00 in the ${label}.`);
                    return null;
                }

                const full = `${pendingGameTime} ${label}`;
                const lastInPeriod = C.sortHistory(lineupHistory).filter(r => r.half === currentHalf).slice(-1)[0];
                if (lastInPeriod && C.parseGameTime(full) < C.parseGameTime(lastInPeriod.gameTime)) {
                    const ok = window.confirm(
                        `${full} is EARLIER in the game than the last entry (${lastInPeriod.gameTime}).\n` +
                        `The clock counts down, so this is usually a typo.\n\nSave it anyway?`
                    );
                    if (!ok) return null;
                }
                return full;
            };

            const confirmAllChanges = () => {
                if (pendingChanges.length === 0) { alert('No changes to confirm.'); return; }
                const full = validateTime();
                if (!full) return;

                const description = pendingChanges
                    .map(c => `${playerName(c.oldPlayerId)} OUT, ${playerName(c.newPlayerId)} IN`)
                    .join('; ');
                appendRecords([makeRecord(full, description)]);
                writeGameState({ currentLineup: names(currentLineup), currentHalf, gameTime: pendingGameTime });
                resetSegmentStats();

                setPreviousLineup([...currentLineup]);
                setGameTime(pendingGameTime);
                setPendingChanges([]);
                setModal(null);
                setPendingGameTime('');
            };

            const confirmGarbageTime = () => {
                const full = validateTime();
                if (!full) return;
                appendRecords([makeRecord(full, 'Garbage Time Start', {
                    previousLineup: names(currentLineup),
                    garbageTime: true
                })]);
                send(db().update(db().ref(path('game-info')), { garbageTimeStart: full }));
                resetSegmentStats();
                setGarbageMarked(true);
                setGameTime(pendingGameTime);
                setModal(null);
                setPendingGameTime('');
            };

            const openTimeModal = (kind) => {
                if (kind === 'subTime' && pendingChanges.length === 0) {
                    alert('No changes to confirm. Make some substitutions first.');
                    return;
                }
                if (kind === 'garbageTime' && blockIfPending()) return;
                setPendingGameTime('');
                setModal(kind);
            };

            // ---- totals ----

            const allSegmentStats = [...lineupHistory.map(r => r.completedSegmentStats), currentStats];
            const total = (team, stat) => allSegmentStats.reduce((t, s) => t + (s?.[team]?.[stat] || 0), 0);
            const totalVTPossessions = total('vt', 'possessions');

            const historyNewestFirst = [...C.sortHistory(lineupHistory)].reverse();

            // ---- render helpers ----

            const card = `rounded-lg shadow-lg ${darkMode ? 'bg-gray-800' : 'bg-white'}`;
            const textMain = darkMode ? 'text-white' : 'text-gray-900';
            const textSub = darkMode ? 'text-gray-300' : 'text-gray-700';
            const selectCls = `w-full p-2 border rounded-md focus:ring-2 focus:ring-blue-500 ${darkMode ? 'bg-gray-700 border-gray-600 text-white' : 'bg-white border-gray-300 text-gray-900'}`;

            const ScoreButtons = ({ team, score, color }) => (
                <div className="flex justify-center gap-2">
                    {[1, 2, 3].map(p => (
                        <button key={p} onClick={() => updateScore(team, p)} disabled={!gameStarted}
                            className={`px-4 py-2 rounded-md font-medium text-white ${!gameStarted ? 'cursor-not-allowed opacity-50' : ''} ${color}`}>+{p}</button>
                    ))}
                    <button onClick={() => updateScore(team, -1)} disabled={!gameStarted || score === 0}
                        className={`px-4 py-2 rounded-md font-medium text-white bg-red-500 hover:bg-red-600 ${!gameStarted || score === 0 ? 'cursor-not-allowed opacity-50' : ''}`}>-1</button>
                </div>
            );

            const StatRow = ({ team, title }) => (
                <div className="mb-6 last:mb-0">
                    <h3 className={`text-lg font-medium mb-3 text-center ${textMain}`}>{title}</h3>
                    <div className="grid grid-cols-4 gap-4">
                        {[['possessions', 'Possessions'], ['offensiveRebounds', 'Off Reb'], ['defensiveRebounds', 'Def Reb'], ['turnovers', 'Turnovers']].map(([stat, statLabel]) => (
                            <div key={stat} className="text-center">
                                <div className="flex justify-center items-center gap-2 mb-2">
                                    <button onClick={() => updateStat(team, stat, -1)} disabled={!gameStarted}
                                        className={`px-3 py-2 rounded-md font-medium text-sm text-white bg-red-500 hover:bg-red-600 ${!gameStarted ? 'cursor-not-allowed opacity-50' : ''}`}>-</button>
                                    <div className={`text-lg font-bold min-w-[2rem] ${textMain}`}>{currentStats[team][stat]}</div>
                                    <button onClick={() => updateStat(team, stat, 1)} disabled={!gameStarted}
                                        className={`px-3 py-2 rounded-md font-medium text-sm text-white bg-green-500 hover:bg-green-600 ${!gameStarted ? 'cursor-not-allowed opacity-50' : ''}`}>+</button>
                                </div>
                                <div className={`text-sm ${textSub}`}>{statLabel}</div>
                            </div>
                        ))}
                    </div>
                </div>
            );

            if (seasonGames.length === 0) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4">
                        <div className={`${card} p-8 max-w-lg text-center`}>
                            <h1 className={`text-2xl font-bold mb-2 ${textMain}`}>No games scheduled</h1>
                            <p className={textSub}>Add the {CFG.CURRENT_SEASON} schedule to <code>config.js</code> to start tracking.</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className={`min-h-screen p-4 ${darkMode ? 'bg-gray-900' : 'bg-gray-100'}`}>
                    <div className="max-w-6xl mx-auto">
                        <div className="flex flex-wrap justify-between items-center gap-3 mb-6">
                            <h1 className={`text-3xl font-bold ${textMain}`}>VT Basketball Lineup Tracker</h1>
                            <div className="flex items-center gap-3">
                                <span className={`flex items-center gap-2 text-sm px-3 py-1 rounded-md ${online ? 'bg-green-100 text-green-800' : 'bg-red-600 text-white font-semibold'}`}>
                                    <span className={`w-2 h-2 rounded-full ${online ? 'bg-green-500' : 'bg-white animate-pulse'}`}></span>
                                    {online ? 'Online' : 'OFFLINE — keep this page open, changes will sync'}
                                </span>
                                <button onClick={() => setDarkMode(!darkMode)}
                                    className={`px-4 py-2 rounded-md ${darkMode ? 'bg-yellow-500 text-gray-900 hover:bg-yellow-600' : 'bg-gray-800 text-white hover:bg-gray-700'}`}>
                                    {darkMode ? 'Light' : 'Dark'}
                                </button>
                            </div>
                        </div>

                        {writeError && (
                            <div className="rounded-lg p-4 mb-6 bg-red-600 text-white flex justify-between items-start gap-4">
                                <div>
                                    <div className="font-semibold">A save to the database failed — data may be missing.</div>
                                    <div className="text-sm opacity-90">{writeError}</div>
                                </div>
                                <button onClick={() => setWriteError(null)} className="px-3 py-1 bg-white text-red-700 rounded text-sm font-medium">Dismiss</button>
                            </div>
                        )}

                        <div className={`${card} p-4 mb-6`}>
                            <div className="flex flex-wrap items-center justify-between gap-3">
                                <div className="flex items-center gap-4">
                                    <label className={`text-sm font-medium ${textSub}`}>Select Game:</label>
                                    <select value={selectedGame} onChange={(e) => setSelectedGame(e.target.value)} disabled={gameStarted}
                                        className={`px-3 py-2 border rounded-md ${gameStarted ? 'opacity-50 cursor-not-allowed' : ''} ${darkMode ? 'bg-gray-700 border-gray-600 text-white' : 'bg-white border-gray-300 text-gray-900'}`}>
                                        {seasonGames.map(g => <option key={g.date} value={g.date}>{g.displayName}{g.exhibition ? ' (exh)' : ''}</option>)}
                                    </select>
                                </div>

                                <div className="flex flex-wrap items-center gap-3">
                                    {gameStarted && (
                                        <>
                                            <div className={`flex items-center gap-2 text-sm ${darkMode ? 'text-green-400' : 'text-green-600'}`}>
                                                <div className="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                                                Last entry: {gameTime} {label}
                                            </div>
                                            <button onClick={() => openTimeModal('garbageTime')} disabled={garbageMarked}
                                                className={`px-3 py-1 rounded-md text-sm font-medium ${garbageMarked ? 'bg-gray-400 text-white cursor-not-allowed' : 'bg-amber-600 text-white hover:bg-amber-700'}`}>
                                                {garbageMarked ? 'Garbage Time ✓' : 'Mark Garbage Time'}
                                            </button>
                                            <button onClick={endPeriod}
                                                className="px-3 py-1 bg-purple-600 text-white rounded-md hover:bg-purple-700 text-sm font-medium">
                                                {currentHalf === 1 ? 'End 1st Half' : currentHalf === 2 ? 'Start OT' : 'Next OT'}
                                            </button>
                                        </>
                                    )}
                                    {!gameStarted ? (
                                        <button onClick={startGame} className="px-4 py-2 bg-green-600 text-white rounded-md hover:bg-green-700 font-medium">Start Game</button>
                                    ) : (
                                        <button onClick={endGame} className="px-4 py-2 bg-red-600 text-white rounded-md hover:bg-red-700 font-medium">End Game</button>
                                    )}
                                </div>
                            </div>
                        </div>

                        {(modal === 'startLineup' || modal === 'start2nd') && (
                            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
                                <div className={`p-6 rounded-lg shadow-xl max-w-3xl w-full mx-4 ${darkMode ? 'bg-gray-800' : 'bg-white'}`}>
                                    <h3 className={`text-xl font-semibold mb-6 text-center ${textMain}`}>
                                        {modal === 'start2nd' ? 'Select 2nd Half Starting Lineup' : `Select Starting Lineup vs ${currentOpponent}`}
                                    </h3>
                                    <div className="grid grid-cols-5 gap-4 mb-6">
                                        {currentLineup.map((playerId, index) => (
                                            <div key={index} className="text-center">
                                                <label className={`block text-sm font-medium mb-2 ${textSub}`}>Player {index + 1}</label>
                                                <select value={playerId} onChange={(e) => handleStartingLineupChange(index, e.target.value)} className={selectCls}>
                                                    {roster.filter(p => !currentLineup.includes(p.id) || p.id === playerId).map(p => (
                                                        <option key={p.id} value={p.id}>#{p.id} {p.name.split(' ').pop()}</option>
                                                    ))}
                                                </select>
                                            </div>
                                        ))}
                                    </div>
                                    <div className="flex gap-3">
                                        {modal === 'startLineup' && (
                                            <button onClick={() => setModal(null)}
                                                className={`flex-1 px-4 py-2 border rounded-md ${darkMode ? 'text-gray-300 border-gray-600 hover:bg-gray-700' : 'text-gray-600 border-gray-300 hover:bg-gray-50'}`}>Cancel</button>
                                        )}
                                        <button onClick={modal === 'start2nd' ? confirmStart2ndHalf : confirmStartGame}
                                            className="flex-1 px-4 py-2 bg-green-600 text-white rounded-md hover:bg-green-700">
                                            {modal === 'start2nd' ? 'Start 2nd Half' : 'Start Game'}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {pendingChanges.length > 0 && (
                            <div className={`rounded-lg p-4 mb-6 border ${darkMode ? 'bg-yellow-800 border-yellow-600' : 'bg-yellow-100 border-yellow-400'}`}>
                                <div className="flex justify-between items-center">
                                    <div>
                                        <h3 className={`font-semibold ${darkMode ? 'text-yellow-100' : 'text-yellow-800'}`}>Pending Substitutions ({pendingChanges.length})</h3>
                                        <div className={`text-sm ${darkMode ? 'text-yellow-200' : 'text-yellow-700'}`}>
                                            {pendingChanges.map((c, i) => <div key={i}>{playerName(c.oldPlayerId)} → {playerName(c.newPlayerId)}</div>)}
                                        </div>
                                    </div>
                                    <div className="flex gap-2">
                                        <button onClick={cancelChanges} className="px-3 py-1 text-sm bg-red-600 text-white rounded hover:bg-red-700">Cancel</button>
                                        <button onClick={() => openTimeModal('subTime')} className="px-3 py-1 text-sm bg-green-600 text-white rounded hover:bg-green-700">Confirm All</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        <div className={`${card} p-6 mb-6 ${!gameStarted ? 'opacity-50' : ''}`}>
                            <h2 className={`text-xl font-semibold mb-4 ${textMain}`}>
                                Current Lineup (5 Active Players)
                                {!gameStarted && <span className="text-sm font-normal text-orange-500 ml-2">Start game to enable</span>}
                            </h2>
                            <div className="grid grid-cols-5 gap-4">
                                {currentLineup.map((playerId, index) => (
                                    <div key={index} className="text-center">
                                        <label className={`block text-sm font-medium mb-2 ${textSub}`}>Player {index + 1}</label>
                                        <select value={playerId} onChange={(e) => handleLineupChange(index, e.target.value)} disabled={!gameStarted}
                                            className={`${selectCls} ${!gameStarted ? 'cursor-not-allowed' : ''}`}>
                                            <option value={playerId}>{playerName(playerId)}</option>
                                            {roster.filter(p => !currentLineup.includes(p.id)).map(p => (
                                                <option key={p.id} value={p.id}>{p.name} ({p.position})</option>
                                            ))}
                                        </select>
                                    </div>
                                ))}
                            </div>
                        </div>

                        <div className={`${card} p-6 mb-6 ${!gameStarted ? 'opacity-50' : ''}`}>
                            <h2 className={`text-xl font-semibold mb-4 text-center ${textMain}`}>
                                Live Score
                                {!gameStarted && <span className="text-sm font-normal text-orange-500 ml-2">Start game to enable</span>}
                            </h2>
                            {gameStarted && (
                                <div className={`text-center mb-6 pb-4 border-b ${darkMode ? 'border-gray-700' : 'border-gray-200'}`}>
                                    <div className={`text-sm font-medium mb-1 ${darkMode ? 'text-gray-400' : 'text-gray-600'}`}>Total VT Possessions</div>
                                    <div className={`text-3xl font-bold ${darkMode ? 'text-orange-400' : 'text-orange-600'}`}>{totalVTPossessions}</div>
                                </div>
                            )}
                            <div className="grid grid-cols-2 gap-8">
                                <div className="text-center">
                                    <h3 className={`text-lg font-medium mb-3 ${textMain}`}>Virginia Tech</h3>
                                    <div className={`text-4xl font-bold mb-4 ${textMain}`}>{vtScore}</div>
                                    <ScoreButtons team="vt" score={vtScore} color="bg-orange-500 hover:bg-orange-600" />
                                </div>
                                <div className="text-center">
                                    <h3 className={`text-lg font-medium mb-3 ${textMain}`}>{currentOpponent}</h3>
                                    <div className={`text-4xl font-bold mb-4 ${textMain}`}>{oppScore}</div>
                                    <ScoreButtons team="opponent" score={oppScore} color="bg-blue-500 hover:bg-blue-600" />
                                </div>
                            </div>
                        </div>

                        {(modal === 'subTime' || modal === 'garbageTime') && (
                            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
                                <div className={`p-6 rounded-lg shadow-xl max-w-md w-full mx-4 ${darkMode ? 'bg-gray-800' : 'bg-white'}`}>
                                    <h3 className={`text-lg font-semibold mb-4 ${textMain}`}>
                                        {modal === 'garbageTime' ? 'When did garbage time start?' : 'Record Time for Substitution'}
                                    </h3>
                                    {modal === 'garbageTime' && (
                                        <p className={`text-sm mb-4 ${textSub}`}>Everything from this point on can be excluded with the Garbage Time toggle on the dashboards. This can't be undone from here.</p>
                                    )}
                                    <label className={`block text-sm font-medium mb-1 ${textSub}`}>Game clock ({label})</label>
                                    <input type="text" inputMode="numeric" autoFocus value={pendingGameTime}
                                        onChange={(e) => setPendingGameTime(e.target.value.replace(/[^0-9:]/g, ''))}
                                        onKeyDown={(e) => { if (e.key === 'Enter') (modal === 'garbageTime' ? confirmGarbageTime : confirmAllChanges)(); }}
                                        placeholder="e.g. 15:42 or 4:22"
                                        className={`w-full p-2 border rounded-md focus:ring-2 focus:ring-blue-500 ${darkMode ? 'bg-gray-700 border-gray-600 text-white placeholder-gray-400' : 'bg-white border-gray-300 text-gray-900 placeholder-gray-500'}`} />
                                    {pendingGameTime && !TIME_RE.test(pendingGameTime) && (
                                        <p className="text-red-500 text-xs mt-1">Format should be M:SS or MM:SS (e.g. 4:22 or 15:42)</p>
                                    )}
                                    <div className="flex gap-3 mt-6">
                                        <button onClick={() => setModal(null)}
                                            className={`flex-1 px-4 py-2 border rounded-md ${darkMode ? 'text-gray-300 border-gray-600 hover:bg-gray-700' : 'text-gray-600 border-gray-300 hover:bg-gray-50'}`}>Cancel</button>
                                        <button onClick={modal === 'garbageTime' ? confirmGarbageTime : confirmAllChanges}
                                            className="flex-1 px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">
                                            {modal === 'garbageTime' ? 'Mark Garbage Time' : 'Confirm Changes'}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                        <div className={`${card} p-6 mb-6 ${!gameStarted ? 'opacity-50' : ''}`}>
                            <h2 className={`text-xl font-semibold mb-4 ${textMain}`}>
                                Game Stats <span className={`text-sm font-normal ${textSub}`}>(current stint — resets on each sub)</span>
                                {!gameStarted && <span className="text-sm font-normal text-orange-500 ml-2">Start game to enable</span>}
                            </h2>
                            <StatRow team="vt" title="Virginia Tech" />
                            <StatRow team="opponent" title={currentOpponent} />
                        </div>

                        <div className={`${card} p-4 mb-6`}>
                            <div className="grid grid-cols-2 gap-8">
                                {[['vt', 'Virginia Tech'], ['opponent', currentOpponent]].map(([team, title]) => (
                                    <div key={team} className="text-center">
                                        <h3 className={`text-sm font-medium mb-2 ${darkMode ? 'text-gray-400' : 'text-gray-600'}`}>{title} - Total Game Stats</h3>
                                        <div className={`flex justify-center gap-6 text-sm ${textSub}`}>
                                            <div><span className="font-semibold">Off Reb:</span> {total(team, 'offensiveRebounds')}</div>
                                            <div><span className="font-semibold">Def Reb:</span> {total(team, 'defensiveRebounds')}</div>
                                            <div><span className="font-semibold">TO:</span> {total(team, 'turnovers')}</div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        <div className={`${card} p-6`}>
                            <h2 className={`text-xl font-semibold mb-4 ${textMain}`}>Lineup Changes History <span className={`text-sm font-normal ${textSub}`}>(newest first)</span></h2>
                            {historyNewestFirst.length === 0 ? (
                                <p className={`text-center py-4 ${darkMode ? 'text-gray-400' : 'text-gray-500'}`}>No lineup changes yet</p>
                            ) : (
                                <div className="space-y-3">
                                    {historyNewestFirst.map((r, i) => (
                                        <div key={i} className={`border-l-4 pl-4 py-2 ${r.garbageTime ? 'border-amber-500' : 'border-blue-500'}`}>
                                            <div className={`font-medium ${textMain}`}>{r.changes}</div>
                                            <div className={`text-sm ${textSub}`}>{r.gameTime} | Score: {r.vtScore}-{r.oppScore}</div>
                                            <div className={`text-xs mt-1 ${darkMode ? 'text-gray-400' : 'text-gray-500'}`}>New Lineup: {r.newLineup}</div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        // Shown instead of the tracker until the tablet is signed in (only if INPUT_SIGN_IN.enabled).
        const SignInGate = ({ children }) => {
            const [user, setUser] = useState(undefined); // undefined = still checking
            const [email, setEmail] = useState(CFG.INPUT_SIGN_IN.email || '');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');
            const [busy, setBusy] = useState(false);

            useEffect(() => {
                let unsub;
                const wait = setInterval(() => {
                    if (!window.firebaseAuth) return;
                    clearInterval(wait);
                    unsub = window.firebaseAuth.onChange(setUser);
                }, 50);
                return () => { clearInterval(wait); unsub && unsub(); };
            }, []);

            const submit = async (e) => {
                e.preventDefault();
                setBusy(true);
                setError('');
                try {
                    await window.firebaseAuth.signIn(email.trim(), password);
                } catch (err) {
                    setError(err.code === 'auth/network-request-failed'
                        ? 'No connection — sign in once you have wifi.'
                        : 'Wrong password.');
                }
                setBusy(false);
            };

            if (user === undefined) {
                return <div className="min-h-screen flex items-center justify-center text-gray-500">Loading…</div>;
            }
            if (user) {
                return (
                    <>
                        {children}
                        <div className="text-center text-xs text-gray-500 pb-4">
                            Signed in as {user} · <button className="underline" onClick={() => window.confirm('Sign out of the lineup tracker on this device?') && window.firebaseAuth.signOut()}>Sign out</button>
                        </div>
                    </>
                );
            }
            return (
                <div className="min-h-screen flex items-center justify-center bg-gray-100 p-4">
                    <form onSubmit={submit} className="bg-white rounded-lg shadow-lg p-8 w-full max-w-sm space-y-4">
                        <h1 className="text-2xl font-bold text-gray-900">VT Lineup Tracker</h1>
                        <p className="text-sm text-gray-600">Sign in once on this device to enter game data. You'll stay signed in.</p>
                        {!CFG.INPUT_SIGN_IN.email && (
                            <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} placeholder="Email"
                                className="w-full p-3 border border-gray-300 rounded-md" autoComplete="username" />
                        )}
                        <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} placeholder="Password"
                            className="w-full p-3 border border-gray-300 rounded-md" autoComplete="current-password" autoFocus />
                        {error && <p className="text-sm text-red-600">{error}</p>}
                        <button type="submit" disabled={busy || !password}
                            className="w-full py-3 bg-orange-600 text-white rounded-md font-semibold disabled:opacity-50">
                            {busy ? 'Signing in…' : 'Sign in'}
                        </button>
                        <p className="text-xs text-gray-500">Just want to watch? Use the <a href="live.html" className="underline">live dashboard</a> — no sign-in needed.</p>
                    </form>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(
            CFG.INPUT_SIGN_IN.enabled ? <SignInGate><BasketballLineupTracker /></SignInGate> : <BasketballLineupTracker />
        );
    </script>
</body>
</html>
