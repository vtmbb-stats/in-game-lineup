<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VT Basketball Lineup Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="firebase.js"></script>
    <script src="config.js"></script>
    <script src="lineup-core.js"></script>
    <script src="play-log.js"></script>
    <style>
        kbd { font: 600 11px/1 ui-monospace, monospace; padding: 2px 5px; border-radius: 4px; border: 1px solid currentColor; opacity: .7; margin-left: 6px; }
        .btn { border-radius: 6px; padding: 8px 12px; font-weight: 600; font-size: 14px; transition: filter .1s; }
        .btn:hover:not(:disabled) { filter: brightness(1.08); }
        .btn:disabled { opacity: .4; cursor: not-allowed; }
        .btn:focus-visible { outline: 2px solid #c64600; outline-offset: 2px; }
    </style>
</head>
<body class="bg-gray-100">
    <div id="root"></div>

    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
    <script type="text/babel" src="ui.jsx"></script>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef, useCallback } = React;
        const C = window.LineupCore;
        const CFG = window.VT_CONFIG;
        const { Court, TeamLogo, shotDepth } = window.UI;
        const COURT_DEPTH = shotDepth([]); // baseline to a few feet past the top of the arc

        // Keep pages working offline (see sw.js).
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

        const seasonGames = CFG.gamesForSeason(CFG.CURRENT_SEASON);
        const todayYMD = (() => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; })();
        const defaultGameDate = (seasonGames.find(g => g.date >= todayYMD) || seasonGames[seasonGames.length - 1] || {}).date || '';

        // ---------- local storage: the computer's copy is the source of truth during a game ----------
        const store = {
            key: (d) => `vtlt-game-${d}`,
            load: (d) => { try { return JSON.parse(localStorage.getItem(store.key(d))); } catch { return null; } },
            save: (d, g) => { try { localStorage.setItem(store.key(d), JSON.stringify(g)); return true; } catch { return false; } }
        };
        const clean = (o) => JSON.parse(JSON.stringify(o)); // Firebase rejects undefined values
        const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
        const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);

        // "1542" -> 942 seconds (15:42). Accepts "15:42", "1542", "942", "45" (= 0:45).
        const parseClock = (s) => {
            const t = String(s || '').trim();
            let m, sec;
            if ((m = t.match(/^(\d{1,2}):(\d{2})$/))) { sec = +m[1] * 60 + +m[2]; if (+m[2] > 59) return null; }
            else if ((m = t.match(/^\d{1,4}$/))) { const d = t.padStart(4, '0'); if (+d.slice(2) > 59) return null; sec = +d.slice(0, 2) * 60 + +d.slice(2); }
            else return null;
            return sec;
        };

        // Upload one saved game (its plays and its summary) to the database.
        const pushGame = async (g) => {
            const db = window.firebaseDb;
            const roster = CFG.rosterForDate(g.date);
            const b = C.buildPlayLog(g.info, g.events, roster);
            const info = clean({
                ...g.info, legacyCleanup: undefined,
                vtScore: b.score.vt, oppScore: b.score.opp,
                currentLineup: C.idsToNames(b.lineup || [], roster),
                currentPeriod: b.period, lastUpdated: g.updatedAt
            });
            if (g.info.legacyCleanup) {
                await withTimeout(Promise.all(['lineup-changes', 'live-game', 'current-stats', 'player-stats'].map(p => db.remove(db.ref(`${p}/${g.date}`)))), 15000);
            }
            await withTimeout(db.set(db.ref(`events/${g.date}`), clean(g.events)), 15000);
            await withTimeout(db.set(db.ref(`game-info/${g.date}`), info), 15000);
        };

        // Games logged on this computer that still have changes waiting to upload.
        const pendingGames = () => {
            const out = [];
            for (let i = 0; i < localStorage.length; i++) {
                const k = localStorage.key(i);
                if (!k || !k.startsWith('vtlt-game-')) continue;
                const g = store.load(k.slice('vtlt-game-'.length));
                if (g && g.info?.format === 2 && g.version !== g.uploadedVersion) out.push(g);
            }
            return out;
        };

        // ---------- small UI pieces ----------
        const Modal = ({ title, children, onClose, wide }) => (
            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4" onMouseDown={(e) => { if (e.target === e.currentTarget && onClose) onClose(); }}>
                <div className={`bg-white rounded-lg shadow-xl w-full ${wide ? 'max-w-4xl' : 'max-w-lg'} max-h-[90vh] overflow-y-auto p-6`}>
                    <h3 className="text-xl font-semibold mb-4 text-gray-900">{title}</h3>
                    {children}
                </div>
            </div>
        );

        const ClockInput = ({ value, onChange, onEnter, autoFocus = true, label = 'Game clock' }) => {
            const sec = parseClock(value);
            return (
                <div>
                    <label className="block text-sm font-medium text-gray-700 mb-1">{label}</label>
                    <input type="text" inputMode="numeric" autoFocus={autoFocus} value={value}
                        onChange={(e) => onChange(e.target.value.replace(/[^0-9:]/g, ''))}
                        onKeyDown={(e) => { if (e.key === 'Enter' && onEnter) { e.preventDefault(); onEnter(); } e.stopPropagation(); }}
                        placeholder="e.g. 15:42 or 1542" className="w-full p-2 border border-gray-300 rounded-md text-lg" />
                    <p className="text-xs mt-1 text-gray-500">{value ? (sec === null ? 'Use M:SS, e.g. 4:22 or 15:42' : `= ${C.formatSeconds(sec)}`) : 'Type the time left on the clock.'}</p>
                </div>
            );
        };

        const LineupPicker = ({ roster, lineup, setLineup }) => (
            <div className="grid grid-cols-5 gap-3">
                {lineup.map((pid, i) => (
                    <select key={i} value={pid} onChange={(e) => { const n = [...lineup]; n[i] = +e.target.value; setLineup(n); }}
                        className="p-2 border border-gray-300 rounded-md text-sm">
                        {roster.filter(p => !lineup.includes(p.id) || p.id === pid).map(p => <option key={p.id} value={p.id}>#{p.id} {p.name.split(' ').pop()}</option>)}
                    </select>
                ))}
            </div>
        );

        // ---------- the app ----------
        const Tracker = () => {
            const [selectedGame, setSelectedGame] = useState(defaultGameDate);
            const [game, setGame] = useState(null);           // { date, info, events, version, uploadedVersion, updatedAt }
            const [remoteInfo, setRemoteInfo] = useState(undefined);
            const [online, setOnline] = useState(false);
            const [uploadState, setUploadState] = useState({ busy: false, error: null });
            const [flow, setFlow] = useState(null);
            const [modal, setModal] = useState(null);         // { kind, ...data }
            const [subPanel, setSubPanel] = useState(null);   // { out: [], in: [], clock: '', missed: false }
            const [toast, setToast] = useState(null);
            // Which way the court faces on screen (remembered on this computer). Flip it when teams switch baskets.
            const [courtSide, setCourtSide] = useState(() => { try { return localStorage.getItem('vtlt-court-side') || 'left'; } catch { return 'left'; } });
            useEffect(() => { try { localStorage.setItem('vtlt-court-side', courtSide); } catch {} }, [courtSide]);
            const gameRef = useRef(null);
            gameRef.current = game;

            const roster = useMemo(() => CFG.rosterForDate(selectedGame), [selectedGame]);
            const sched = CFG.findGame(selectedGame);
            const opponent = sched?.opponent || 'Opponent';
            const name = (id) => roster.find(p => p.id === id)?.name || `#${id}`;
            const last = (id) => name(id).split(' ').pop();
            const defaultStarters = useMemo(() => {
                const s = CFG.SEASONS[CFG.seasonForDate(selectedGame)]?.defaultStarters || [];
                return s.length === 5 && s.every(id => roster.some(p => p.id === id)) ? [...s] : roster.slice(0, 5).map(p => p.id);
            }, [roster, selectedGame]);

            const showToast = (text, action) => { setToast({ text, action, at: Date.now() }); };
            useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(null), 6000); return () => clearTimeout(t); }, [toast]);

            // ----- connection -----
            useEffect(() => {
                let unsub;
                const wait = setInterval(() => {
                    if (!window.firebaseDb) return;
                    clearInterval(wait);
                    unsub = window.firebaseDb.watch('.info/connected', v => setOnline(v === true));
                }, 100);
                return () => { clearInterval(wait); unsub && unsub(); };
            }, []);

            // ----- load the selected game: local copy first, then the database -----
            useEffect(() => {
                setFlow(null); setModal(null); setSubPanel(null); setRemoteInfo(undefined);
                if (!selectedGame) { setGame(null); return; }
                const local = store.load(selectedGame);
                setGame(local && local.info?.format === 2 ? local : null);
                let cancelled = false;
                (async () => {
                    if (!window.firebaseDb) { setRemoteInfo(null); return; }
                    try {
                        const info = await withTimeout(window.firebaseDb.read(`game-info/${selectedGame}`), 4000);
                        if (cancelled) return;
                        setRemoteInfo(info);
                        // No copy on this computer but the game exists online (e.g. reviewing on another machine): pull it down.
                        if (!(local && local.info?.format === 2) && info?.format === 2) {
                            const events = await withTimeout(window.firebaseDb.read(`events/${selectedGame}`), 6000) || {};
                            if (cancelled) return;
                            const g = { date: selectedGame, info, events, version: 1, uploadedVersion: 1, updatedAt: info.lastUpdated || new Date().toISOString() };
                            store.save(selectedGame, g); setGame(g);
                        }
                    } catch { if (!cancelled) setRemoteInfo(null); }
                })();
                return () => { cancelled = true; };
            }, [selectedGame]);

            // ----- derived game state -----
            const built = useMemo(() => game ? C.buildPlayLog(game.info, game.events, roster, { current: true }) : null, [game, roster]);
            const events = built ? built.events : [];
            const periodOpen = useMemo(() => {
                const pe = [...events].reverse().find(e => e.type === 'period_start' || e.type === 'period_end');
                return pe?.type === 'period_start' ? pe : null;
            }, [events]);
            const lineupNow = useMemo(() => (built?.lineup || []).slice().sort((a, b) => roster.findIndex(p => p.id === a) - roster.findIndex(p => p.id === b)), [built, roster]);
            const lastClock = useMemo(() => {
                if (!periodOpen) return null;
                const after = events.filter(e => e.seq >= periodOpen.seq);
                const withClock = [...after].reverse().find(e => typeof e.clock === 'number');
                return withClock ? withClock.clock : periodOpen.length;
            }, [events, periodOpen]);
            const ball = useMemo(() => {
                for (let i = events.length - 1; i >= 0; i--) {
                    const e = events[i];
                    if (e.poss && !e.possVoid) return e.poss === 'vt' ? 'opp' : 'vt';
                    if ((e.type === 'shot' || e.type === 'ft') && !e.made && e.reb && e.reb !== 'none') return e.reb;
                    if (e.ballTo === 'vt' || e.ballTo === 'opp') return e.ballTo;
                    if (e.type === 'period_start') return null;
                }
                return null;
            }, [events]);
            const started = !!game?.info?.started;
            const ended = !!game?.info?.ended;
            const live = started && !ended;
            const reviewCount = built ? built.review.unplacedSubs.length + built.review.unseenShots.length : 0;

            // ----- persistence -----
            const mutate = (fn) => {
                setGame(prev => {
                    const g = clean(prev);
                    fn(g);
                    g.version = (g.version || 0) + 1;
                    g.updatedAt = new Date().toISOString();
                    if (!store.save(g.date, g)) showToast('Could not save on this computer (storage full?). Keep this page open.');
                    return g;
                });
            };
            // The order number is assigned inside the state update, so fast keypresses can't collide.
            const commit = (ev, seq) => {
                const id = newId();
                mutate(g => {
                    const s = seq ?? Math.max(0, ...Object.values(g.events).map(x => x.seq)) + 1;
                    g.events[id] = clean({ id, seq: s, ...ev });
                });
                return { id, ...ev };
            };
            const patchEvent = (id, patch) => mutate(g => { if (g.events[id]) Object.assign(g.events[id], clean(patch)); Object.keys(patch).forEach(k => { if (patch[k] === undefined || patch[k] === null) delete g.events[id][k]; }); });
            const deleteEvent = (id) => mutate(g => { delete g.events[id]; });

            // ----- upload whenever there are new changes and we're connected -----
            const uploading = useRef(false);
            const upload = useCallback(async () => {
                const g = gameRef.current;
                if (!g || !window.firebaseDb || !online || uploading.current || g.version === g.uploadedVersion) return;
                uploading.current = true;
                setUploadState({ busy: true, error: null });
                const v = g.version;
                try {
                    await pushGame(g);
                    setGame(prev => {
                        if (!prev || prev.date !== g.date) return prev;
                        const n = { ...prev, uploadedVersion: v, info: { ...prev.info, legacyCleanup: undefined } };
                        store.save(n.date, clean(n));
                        return clean(n);
                    });
                    setUploadState({ busy: false, error: null });
                } catch (err) {
                    setUploadState({ busy: false, error: err.message === 'timeout' ? 'Upload is taking too long; will retry.' : err.message });
                } finally {
                    uploading.current = false;
                    // Plays logged while this upload was running go up right away.
                    setTimeout(() => { const cur = gameRef.current; if (cur && cur.version !== cur.uploadedVersion) upload(); }, 500);
                }
            }, [online]);
            useEffect(() => { const t = setTimeout(upload, 1200); return () => clearTimeout(t); }, [game?.version, online, upload]);
            useEffect(() => { const t = setInterval(upload, 15000); return () => clearInterval(t); }, [upload]);

            // Other games on this computer with unsent changes (e.g. logged offline, then switched games).
            const [otherPending, setOtherPending] = useState(0);
            useEffect(() => {
                const run = async () => {
                    const others = pendingGames().filter(g => g.date !== gameRef.current?.date);
                    setOtherPending(others.length);
                    if (!online || !window.firebaseDb) return;
                    for (const g of others) {
                        try {
                            await pushGame(g);
                            const cur = store.load(g.date);
                            if (cur && cur.version === g.version) { cur.uploadedVersion = g.version; delete cur.info.legacyCleanup; store.save(g.date, cur); }
                        } catch { /* try again next round */ }
                    }
                    setOtherPending(pendingGames().filter(g => g.date !== gameRef.current?.date).length);
                };
                run();
                const t = setInterval(run, 20000);
                return () => clearInterval(t);
            }, [online, selectedGame]);

            // ----- starting and ending -----
            const startGame = () => {
                const local = store.load(selectedGame);
                const existing = (local && local.info?.started) || remoteInfo?.started;
                if (existing && !window.confirm(`This game already has data${remoteInfo?.started ? ' online' : ' on this computer'}.\n\nStarting over will REPLACE it when this computer next uploads.\n\nStart over?`)) return;
                setModal({ kind: 'startGame', lineup: defaultStarters, custom: false, length: '20', label: '' });
            };
            const confirmStartGame = (m) => {
                const custom = !!(sched?.exhibition && m.custom);
                const length = custom ? Math.round(parseFloat(m.length) * 60) : 1200;
                if (custom && !(length > 0)) { alert('Enter the length of the first period in minutes.'); return; }
                const label = custom ? (m.label.trim() || 'Period 1') : '1st';
                const g = {
                    date: selectedGame, version: 1, uploadedVersion: 0, updatedAt: new Date().toISOString(),
                    info: { format: 2, started: true, ended: false, season: CFG.seasonForDate(selectedGame), opponent, custom,
                        periods: [{ label, length }], startingLineup: m.lineup, startTime: new Date().toISOString(), legacyCleanup: true },
                    events: {}
                };
                const e = { id: newId(), seq: 1, type: 'period_start', period: 1, label, length, lineup: m.lineup };
                g.events[e.id] = e;
                store.save(selectedGame, g);
                setGame(g); setModal(null); setFlow(null);
            };
            const openNextPeriod = () => {
                const n = (game.info.periods?.length || 0) + 1;
                const lineup = !game.info.custom && n === 2 ? game.info.startingLineup : lineupNow;
                setModal({ kind: 'startPeriod', period: n, lineup: lineup.length === 5 ? lineup : defaultStarters, length: '6', label: `Period ${n}` });
            };
            const confirmStartPeriod = (m) => {
                const custom = game.info.custom;
                const std = C.STANDARD_PERIODS(m.period)[m.period - 1];
                const length = custom ? Math.round(parseFloat(m.length) * 60) : std.length;
                if (!(length > 0)) { alert('Enter the period length in minutes.'); return; }
                const label = custom ? (m.label.trim() || `Period ${m.period}`) : std.label;
                mutate(g => { g.info.periods = [...(g.info.periods || []), { label, length }]; });
                commit({ type: 'period_start', period: m.period, label, length, lineup: m.lineup });
                setModal(null); setFlow(null);
            };
            const confirmEndPeriod = (clockText, thenEndGame) => {
                const clock = parseClock(clockText);
                if (clock === null) { alert('Enter the time left on the clock (0:00 if the period ran out).'); return false; }
                if (lastClock !== null && clock > lastClock) { alert(`That's earlier than the last entry this period (${C.formatSeconds(lastClock)}).`); return false; }
                commit({ type: 'period_end', period: periodOpen.period, clock });
                mutate(g => { const p = g.info.periods[periodOpen.period - 1]; if (p) p.endClock = clock; });
                setFlow(null);
                if (!thenEndGame) setModal(null);
                return true;
            };
            const endGame = () => {
                if (periodOpen) { setModal({ kind: 'endPeriod', clock: '0:00', thenEndGame: true }); return; }
                finishGame();
            };
            const finishGame = () => {
                mutate(g => { g.info.ended = true; g.info.endTime = new Date().toISOString(); g.info.finalVtScore = built.score.vt; g.info.finalOppScore = built.score.opp; });
                setModal(reviewCount ? { kind: 'review' } : null);
                showToast('Game ended. ' + (reviewCount ? `${reviewCount} item${reviewCount > 1 ? 's' : ''} to review.` : 'Nothing left to review.'));
            };

            // ----- possession flows -----
            const canPlay = live && periodOpen && lineupNow.length === 5;
            const needPeriod = () => { showToast(!started ? 'Start the game first.' : ended ? 'This game has ended.' : 'Start the next period first.'); };
            const busy = flow && flow.k !== 'afterMake';
            const begin = (f) => {
                if (!canPlay) { needPeriod(); return; }
                if (busy) { showToast('Finish the current entry first, or press Esc to cancel it.'); return; }
                setFlow(f);
            };

            // poss for an outcome: which team's possession (if any) ended
            const possFor = (team, reb, ballTo) => {
                const other = team === 'vt' ? 'opp' : 'vt';
                if (reb === 'vt' || reb === 'opp') return reb === team ? null : team;
                if (ballTo === 'expired') return team;
                if (ballTo) return ballTo === team ? null : team;
                return null;
            };

            const pickCourt = (x, y) => {
                if (!canPlay) { needPeriod(); return; }
                if (flow && flow.k === 'vtShot' && flow.step === 'shooter') { setFlow({ ...flow, x, y, pts: C.isThree(x, y) ? 3 : 2 }); return; }
                begin({ k: 'vtShot', x, y, pts: C.isThree(x, y) ? 3 : 2, step: 'shooter' });
            };
            const shotUnseen = () => begin({ k: 'vtShot', x: null, y: null, pts: null, step: 'pts' });

            const chooseShooter = (id) => {
                if (flow?.k === 'vtShot') setFlow({ ...flow, shooter: id, step: 'result' });
                else if (flow?.k === 'vtFT') setFlow({ ...flow, shooter: id, step: 'count' });
                else if (flow?.k === 'vtTO') { commit({ type: 'to', team: 'vt', player: id, poss: 'vt' }); setFlow(null); }
            };
            const shotResult = (made) => {
                const f = flow;
                if (made) {
                    const e = commit({ type: 'shot', team: 'vt', pts: f.pts, made: true, shooter: f.shooter, x: f.x, y: f.y, poss: 'vt' });
                    setFlow({ k: 'afterMake', team: 'vt', eventId: e.id, shooter: f.shooter });
                } else setFlow({ ...f, made: false, step: 'reb' });
            };
            const startFTs = (team) => begin(team === 'vt' ? { k: 'vtFT', step: 'shooter' } : { k: 'oppFT', step: 'count' });
            const ftCount = (kind) => {
                const of = kind === '1and1' ? 2 : kind;
                setFlow({ ...flow, of, oneAndOne: kind === '1and1', idx: 1, step: 'shoot' });
            };
            const ftResult = (made) => {
                const f = flow, team = f.k === 'vtFT' ? 'vt' : 'opp';
                const base = { type: 'ft', team, idx: f.idx, of: f.of, oneAndOne: f.oneAndOne || undefined, andOne: f.andOne || undefined, shooter: team === 'vt' ? f.shooter : undefined };
                const lastShot = f.idx === f.of;
                if (made) {
                    commit({ ...base, made: true, poss: lastShot ? team : undefined });
                    if (lastShot) setFlow(null); else setFlow({ ...f, idx: f.idx + 1 });
                } else if (lastShot || (f.oneAndOne && f.idx === 1)) {
                    setFlow({ ...f, step: 'reb', pendingFT: { ...base, made: false } });
                } else {
                    commit({ ...base, made: false });
                    setFlow({ ...f, idx: f.idx + 1 });
                }
            };
            const rebound = (reb) => {
                const f = flow;
                if (reb === 'none') { setFlow({ ...f, step: 'ballTo' }); return; }
                finishMiss(f, reb, undefined);
            };
            const ballTo = (to) => finishMiss(flow, 'none', to);
            const finishMiss = (f, reb, to) => {
                const team = f.k.startsWith('vt') ? 'vt' : 'opp';
                const poss = possFor(team, reb, to);
                if (f.k === 'vtShot') commit({ type: 'shot', team: 'vt', pts: f.pts, made: false, shooter: f.shooter, x: f.x, y: f.y, reb, ballTo: to, poss: poss || undefined });
                else if (f.k === 'oppMiss') commit({ type: 'shot', team: 'opp', pts: 2, made: false, reb, ballTo: to, poss: poss || undefined });
                else commit({ ...f.pendingFT, reb, ballTo: to, poss: poss || undefined });
                setFlow(null);
            };
            const andOne = () => {
                const f = flow;
                patchEvent(f.eventId, { poss: null, andOne: true });
                setFlow(f.team === 'vt' ? { k: 'vtFT', shooter: f.shooter, of: 1, idx: 1, andOne: true, step: 'shoot' } : { k: 'oppFT', of: 1, idx: 1, andOne: true, step: 'shoot' });
            };
            const oppMade = (pts) => {
                if (!canPlay) { needPeriod(); return; }
                if (busy) { showToast('Finish the current entry first, or press Esc to cancel it.'); return; }
                const e = commit({ type: 'shot', team: 'opp', pts, made: true, poss: 'opp' });
                setFlow({ k: 'afterMake', team: 'opp', eventId: e.id });
            };
            const simple = (ev) => {
                if (!canPlay) { needPeriod(); return; }
                if (busy) { showToast('Finish the current entry first, or press Esc to cancel it.'); return; }
                commit(ev); setFlow(null);
            };
            const describe = (e) => {
                const who = (id) => (id === undefined || id === null ? '' : last(id));
                const reb = (e) => e.made ? '' : e.reb === 'vt' ? ', VT rebound' : e.reb === 'opp' ? `, ${opponent} rebound` : e.reb === 'none' ? (e.ballTo === 'expired' ? ', time expired' : `, ball to ${e.ballTo === 'vt' ? 'VT' : opponent}`) : '';
                switch (e.type) {
                    case 'period_start': return `Start of ${e.label}`;
                    case 'period_end': return `End of ${C.periodLabelOf(game?.info, e.period)} (${C.formatSeconds(e.clock)})`;
                    case 'sub': return `${e.clock === null || e.clock === undefined ? '?:??' : C.formatSeconds(e.clock)} Sub: ${(e.in || []).map(last).join(', ')} in for ${(e.out || []).map(last).join(', ')}${e.needsPlacement ? ' (needs placing)' : ''}`;
                    case 'shot': return e.team === 'vt'
                        ? `${who(e.shooter)} ${e.made ? 'made' : 'missed'} ${e.pts}${e.x === null || e.x === undefined ? ' (spot not seen)' : ''}${e.andOne ? ' + and-1' : ''}${reb(e)}`
                        : `${opponent} ${e.made ? 'made' : 'missed'}${e.made ? ' ' + e.pts : ''}${e.andOne ? ' + and-1' : ''}${reb(e)}`;
                    case 'ft': return `${e.team === 'vt' ? who(e.shooter) : opponent} FT ${e.idx} of ${e.of}${e.oneAndOne ? ' (1-and-1)' : ''}: ${e.made ? 'made' : 'missed'}${reb(e)}`;
                    case 'to': return `${e.team === 'vt' ? 'VT turnover: ' + who(e.player) : opponent + ' turnover'}`;
                    case 'expired': return `Time expired (${e.team === 'vt' ? 'VT' : opponent} ball)`;
                    case 'foul': return 'Foul on the floor';
                    case 'garbage': return `${C.formatSeconds(e.clock)} Garbage time starts`;
                    case 'adjust': return `Score correction: ${e.team === 'vt' ? 'VT' : opponent} ${e.pts > 0 ? '+' : ''}${e.pts}`;
                    default: return e.type;
                }
            };
            const didntHappen = () => {
                const target = [...events].reverse().find(e => e.poss && !e.possVoid);
                if (!target) { showToast('No possession to remove.'); return; }
                patchEvent(target.id, { possVoid: true });
                showToast(`Removed the possession count from: ${describe(target)}`, { label: 'Put it back', run: () => patchEvent(target.id, { possVoid: null }) });
            };
            const undoLast = () => {
                const target = events[events.length - 1];
                if (!target) return;
                if (target.type === 'period_start' && target.period === 1) { showToast('Use Start Game to start over.'); return; }
                deleteEvent(target.id);
                if (target.type === 'period_start') mutate(g => { g.info.periods = g.info.periods.slice(0, -1); });
                if (target.type === 'period_end') mutate(g => { const p = g.info.periods[target.period - 1]; if (p) delete p.endClock; });
                setFlow(null);
                showToast(`Undid: ${describe(target)}`, { label: 'Redo', run: () => mutate(g => { g.events[target.id] = target; }) });
            };

            // ----- subs -----
            const openSub = () => {
                if (!canPlay) { needPeriod(); return; }
                setSubPanel({ out: [], in: [], clock: '', missed: false });
            };
            const confirmSub = () => {
                const s = subPanel;
                if (!s.out.length || s.out.length !== s.in.length) { alert('Pick the same number of players going out and coming in.'); return; }
                let clock = null;
                if (!s.missed) {
                    clock = parseClock(s.clock);
                    if (clock === null) { alert('Enter the game clock, or tick "I missed this sub" to place it later.'); return; }
                    if (clock > periodOpen.length) { alert(`The period is only ${C.formatSeconds(periodOpen.length)} long.`); return; }
                    if (lastClock !== null && clock > lastClock && !window.confirm(`${C.formatSeconds(clock)} is earlier than the last entry (${C.formatSeconds(lastClock)}). The clock counts down, so this is usually a typo.\n\nSave anyway?`)) return;
                }
                commit({ type: 'sub', out: s.out, in: s.in, clock, needsPlacement: s.missed || undefined });
                setSubPanel(null);
            };

            // ----- keyboard -----
            useEffect(() => {
                const onKey = (e) => {
                    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA') return;
                    if (modal || subPanel) { if (e.key === 'Escape') { setModal(null); setSubPanel(null); } if (subPanel && e.key === 'Enter') confirmSub(); return; }
                    const k = e.key.toLowerCase();
                    if ((e.ctrlKey || e.metaKey) && k === 'z') { e.preventDefault(); undoLast(); return; }
                    if (e.ctrlKey || e.metaKey || e.altKey) return;
                    if (k === 'escape') { setFlow(null); return; }
                    const f = flow;
                    if (f) {
                        const slot = '12345'.indexOf(k);
                        if ((f.step === 'shooter' || (f.k === 'vtTO' && f.step === 'player')) && slot >= 0 && lineupNow[slot] !== undefined) { chooseShooter(lineupNow[slot]); return; }
                        if (f.step === 'pts' && (k === '2' || k === '3')) { setFlow({ ...f, pts: +k, step: 'shooter' }); return; }
                        if (f.step === 'result' && (k === 'm' || k === 'x')) { shotResult(k === 'm'); return; }
                        if (f.step === 'count' && '123'.includes(k)) { ftCount(k === '1' ? '1and1' : +k); return; }
                        if (f.step === 'shoot' && (k === 'm' || k === 'x')) { ftResult(k === 'm'); return; }
                        if (f.step === 'reb' && 'von'.includes(k)) { rebound(k === 'v' ? 'vt' : k === 'o' ? 'opp' : 'none'); return; }
                        if (f.step === 'ballTo' && 'vok'.includes(k)) { ballTo(k === 'v' ? 'vt' : k === 'o' ? 'opp' : 'expired'); return; }
                        if (f.k === 'vtShot' && f.step !== 'pts' && k === 'p') { setFlow({ ...f, pts: f.pts === 3 ? 2 : 3 }); return; }
                        if (f.k === 'afterMake' && ((f.team === 'vt' && k === 'a') || (f.team === 'opp' && k === 's'))) { andOne(); return; }
                    }
                    if (k === 'b') { openSub(); return; }
                    if (k === 'u') { didntHappen(); return; }
                    if (k === 'q') { shotUnseen(); return; }
                    if (k === 'f') { startFTs('vt'); return; }
                    if (k === 't') { begin({ k: 'vtTO', step: 'player' }); return; }
                    if (k === 'w') { oppMade(2); return; }
                    if (k === 'e') { oppMade(3); return; }
                    if (k === 'r') { begin({ k: 'oppMiss', step: 'reb' }); return; }
                    if (k === 'd') { startFTs('opp'); return; }
                    if (k === 'g') { simple({ type: 'to', team: 'opp', poss: 'opp' }); return; }
                };
                window.addEventListener('keydown', onKey);
                return () => window.removeEventListener('keydown', onKey);
            });

            // ----- placing a missed sub / editing -----
            const placeSub = (sub, beforeEvent, clockText) => {
                const clock = parseClock(clockText);
                if (clock === null) { alert('Enter the game clock when he came in.'); return false; }
                const idx = events.findIndex(e => e.id === beforeEvent.id);
                const prev = events.slice(0, idx).filter(e => e.id !== sub.id).pop();
                const seq = prev ? (prev.seq + beforeEvent.seq) / 2 : beforeEvent.seq - 1;
                // The players going out must be on the floor at that point, and the ones coming in must not.
                let floor = [];
                events.filter(e => e.seq < seq && e.id !== sub.id).forEach(e => {
                    if (e.type === 'period_start') floor = [...e.lineup];
                    if (e.type === 'sub') floor = floor.filter(id => !(e.out || []).includes(id)).concat(e.in || []);
                });
                const notOn = (sub.out || []).filter(id => !floor.includes(id));
                const alreadyOn = (sub.in || []).filter(id => floor.includes(id));
                if (notOn.length || alreadyOn.length) {
                    alert(`That spot doesn't work: ${notOn.length ? notOn.map(name).join(', ') + ' wasn\'t on the floor yet' : ''}${notOn.length && alreadyOn.length ? ', and ' : ''}${alreadyOn.length ? alreadyOn.map(name).join(', ') + ' was already on the floor' : ''}. Pick a later play.`);
                    return false;
                }
                patchEvent(sub.id, { seq, clock, needsPlacement: null });
                return true;
            };

            // ---------- rendering ----------
            const status = !window.firebaseDb ? { text: 'Saving on this computer (database not loaded)', cls: 'bg-yellow-100 text-yellow-900' }
                : !online ? { text: 'Offline · saved on this computer, will upload when connected', cls: 'bg-red-600 text-white' }
                : uploadState.error ? { text: `Upload problem: ${uploadState.error}`, cls: 'bg-red-600 text-white' }
                : game && game.version !== game.uploadedVersion ? { text: 'Saved on this computer · uploading…', cls: 'bg-yellow-100 text-yellow-900' }
                : { text: game ? 'Saved and uploaded' : 'Online', cls: 'bg-green-100 text-green-800' };

            const Key = ({ k }) => <kbd>{k}</kbd>;
            const playerBtn = (id, i, onClick, extra = '') => (
                <button key={id} onClick={() => onClick(id)} className={`btn bg-white border border-gray-300 text-gray-900 text-left ${extra}`}>
                    <span className="text-gray-500 mr-1">{i + 1}</span> #{id} {last(id)}
                </button>
            );

            const prompt = (() => {
                if (!flow) return null;
                const f = flow;
                const team = f.k.startsWith('opp') || f.team === 'opp' ? opponent : 'VT';
                const row = (children) => <div className="flex flex-wrap gap-2">{children}</div>;
                const rebRow = row(<>
                    <button className="btn bg-orange-600 text-white" onClick={() => rebound('vt')}>VT rebound<Key k="V" /></button>
                    <button className="btn bg-blue-600 text-white" onClick={() => rebound('opp')}>{opponent} rebound<Key k="O" /></button>
                    <button className="btn bg-gray-600 text-white" onClick={() => rebound('none')}>None<Key k="N" /></button>
                </>);
                const ballRow = row(<>
                    <button className="btn bg-orange-600 text-white" onClick={() => ballTo('vt')}>Ball to VT<Key k="V" /></button>
                    <button className="btn bg-blue-600 text-white" onClick={() => ballTo('opp')}>Ball to {opponent}<Key k="O" /></button>
                    <button className="btn bg-gray-600 text-white" onClick={() => ballTo('expired')}>Time expired<Key k="K" /></button>
                </>);
                if (f.k === 'afterMake') return { title: `${f.team === 'vt' ? last(f.shooter) : opponent} made it.`, body: row(<button className="btn bg-purple-600 text-white" onClick={andOne}>And-1<Key k={f.team === 'vt' ? 'A' : 'S'} /></button>), hint: 'Or just keep going with the next play.' };
                if (f.k === 'vtShot') {
                    if (f.step === 'pts') return { title: 'Shot (spot not seen): 2 or 3?', body: row(<><button className="btn bg-gray-800 text-white" onClick={() => setFlow({ ...f, pts: 2, step: 'shooter' })}>2-pointer<Key k="2" /></button><button className="btn bg-gray-800 text-white" onClick={() => setFlow({ ...f, pts: 3, step: 'shooter' })}>3-pointer<Key k="3" /></button></>) };
                    const ptsBtn = <button className="btn bg-gray-200 text-gray-900" onClick={() => setFlow({ ...f, pts: f.pts === 3 ? 2 : 3 })}>It's a {f.pts === 3 ? '2' : '3'}<Key k="P" /></button>;
                    if (f.step === 'shooter') return { title: `${f.pts}-point shot${f.x === null ? ' (spot not seen)' : ''}. Who shot it?`, body: <div className="grid gap-2"><div className="grid grid-cols-5 gap-2">{lineupNow.map((id, i) => playerBtn(id, i, chooseShooter))}</div>{f.x !== null && row(ptsBtn)}</div>, hint: 'Click the court again to move the spot.' };
                    if (f.step === 'result') return { title: `${last(f.shooter)} · ${f.pts}-pointer`, body: row(<><button className="btn bg-green-600 text-white text-lg px-6" onClick={() => shotResult(true)}>Make<Key k="M" /></button><button className="btn bg-red-600 text-white text-lg px-6" onClick={() => shotResult(false)}>Miss<Key k="X" /></button>{f.x !== null && ptsBtn}</>) };
                    if (f.step === 'reb') return { title: `${last(f.shooter)} missed. Rebound?`, body: rebRow };
                    if (f.step === 'ballTo') return { title: 'No rebound. Whose ball?', body: ballRow };
                }
                if (f.k === 'vtTO') return { title: 'VT turnover. Who?', body: <div className="grid grid-cols-5 gap-2">{lineupNow.map((id, i) => playerBtn(id, i, chooseShooter))}</div> };
                if (f.k === 'oppMiss') return f.step === 'reb' ? { title: `${opponent} missed. Rebound?`, body: rebRow } : { title: 'No rebound. Whose ball?', body: ballRow };
                if (f.k === 'vtFT' || f.k === 'oppFT') {
                    const shooter = f.k === 'vtFT' ? (f.shooter !== undefined ? last(f.shooter) : null) : opponent;
                    if (f.step === 'shooter') return { title: 'VT free throws. Who is shooting?', body: <div className="grid grid-cols-5 gap-2">{lineupNow.map((id, i) => playerBtn(id, i, chooseShooter))}</div> };
                    if (f.step === 'count') return { title: `${shooter} free throws. How many?`, body: row(<>
                        <button className="btn bg-gray-800 text-white" onClick={() => ftCount('1and1')}>1-and-1<Key k="1" /></button>
                        <button className="btn bg-gray-800 text-white" onClick={() => ftCount(2)}>Two<Key k="2" /></button>
                        <button className="btn bg-gray-800 text-white" onClick={() => ftCount(3)}>Three<Key k="3" /></button></>) };
                    if (f.step === 'shoot') return { title: `${shooter}: free throw ${f.idx} of ${f.of}${f.oneAndOne ? ' (1-and-1)' : ''}${f.andOne ? ' (and-1)' : ''}`, body: row(<><button className="btn bg-green-600 text-white text-lg px-6" onClick={() => ftResult(true)}>Make<Key k="M" /></button><button className="btn bg-red-600 text-white text-lg px-6" onClick={() => ftResult(false)}>Miss<Key k="X" /></button></>), hint: 'You can make a sub between free throws. The rest are saved as they are shot.' };
                    if (f.step === 'reb') return { title: `${shooter} missed the last free throw. Rebound?`, body: rebRow };
                    if (f.step === 'ballTo') return { title: 'No rebound. Whose ball?', body: ballRow };
                }
                return null;
            })();

            const recent = [...events].reverse().slice(0, 10);
            const placed = built ? built.shots.filter(s => s.x !== null) : [];
            const periodShots = periodOpen ? placed.filter(s => s.period === periodOpen.period) : placed;

            if (seasonGames.length === 0) return <div className="p-8">Add the {CFG.CURRENT_SEASON} schedule to config.js.</div>;

            return (
                <div className="min-h-screen p-3 text-gray-900">
                    {/* Header */}
                    <div className="bg-white rounded-lg shadow p-3 mb-3 flex flex-wrap items-center gap-3">
                        <select value={selectedGame} onChange={(e) => setSelectedGame(e.target.value)} disabled={live && !!flow}
                            className="p-2 border border-gray-300 rounded-md text-sm">
                            {seasonGames.map(g => <option key={g.date} value={g.date}>{g.displayName}{g.exhibition ? ' (exh)' : ''}</option>)}
                        </select>
                        {started && (
                            <div className="flex items-center gap-2" aria-label={`Virginia Tech ${built.score.vt}, ${opponent} ${built.score.opp}`}>
                                <TeamLogo name="Virginia Tech" size={36} />
                                <span className="text-3xl font-bold tabular-nums">{built.score.vt}</span>
                                <span className="text-2xl text-gray-400">–</span>
                                <span className="text-3xl font-bold tabular-nums">{built.score.opp}</span>
                                <TeamLogo name={opponent} size={36} />
                            </div>
                        )}
                        {live && (
                            <div className="flex items-center gap-3 text-sm text-gray-700">
                                {periodOpen ? <span>{periodOpen.label} · last clock {C.formatSeconds(lastClock)}</span> : <span className="text-orange-700 font-semibold">Between periods</span>}
                                <span className="flex items-center gap-1">Possessions <TeamLogo name="Virginia Tech" size={18} /> {built.possessions.vt} <TeamLogo name={opponent} size={18} /> {built.possessions.opp}</span>
                                {ball && <span className={`flex items-center gap-1 px-2 py-0.5 rounded text-xs font-semibold ${ball === 'vt' ? 'bg-orange-100 text-orange-900' : 'bg-blue-100 text-blue-900'}`}><TeamLogo name={ball === 'vt' ? 'Virginia Tech' : opponent} size={18} /> ball</span>}
                            </div>
                        )}
                        <div className="flex-1"></div>
                        <span className={`text-xs px-2 py-1 rounded ${status.cls}`}>{status.text}</span>
                        {otherPending > 0 && <span className="text-xs px-2 py-1 rounded bg-yellow-100 text-yellow-900">{otherPending} other game{otherPending > 1 ? 's' : ''} waiting to upload</span>}
                        {started && <button className="btn bg-amber-100 text-amber-900" onClick={() => setModal({ kind: 'review' })}>Review{reviewCount ? ` (${reviewCount})` : ''}</button>}
                        {started && <button className="btn bg-gray-100 text-gray-800" onClick={() => setModal({ kind: 'log' })}>Full log</button>}
                        {live && periodOpen && <button className="btn bg-gray-100 text-gray-800" onClick={() => setModal({ kind: 'garbage', clock: '' })} disabled={events.some(e => e.type === 'garbage')}>Garbage time</button>}
                        {live && periodOpen && <button className="btn bg-purple-600 text-white" onClick={() => setModal({ kind: 'endPeriod', clock: '0:00' })}>End {periodOpen.label}</button>}
                        {live && !periodOpen && <button className="btn bg-purple-600 text-white" onClick={openNextPeriod}>Start next period</button>}
                        {!live && <button className="btn bg-green-600 text-white" onClick={startGame}>{started ? 'Start over' : 'Start game'}</button>}
                        {live && <button className="btn bg-red-600 text-white" onClick={endGame}>End game</button>}
                    </div>

                    {!started ? (
                        <div className="bg-white rounded-lg shadow p-8 text-center text-gray-600">
                            {remoteInfo?.started && remoteInfo.format !== 2 ? 'This game has data in the old format. Starting it will replace that data.' : 'Press Start game when you are ready.'}
                            {sched?.exhibition && <div className="mt-2 text-sm">This is an exhibition, so you can set custom period lengths.</div>}
                        </div>
                    ) : (
                        <div className="grid gap-3" style={{ gridTemplateColumns: 'auto minmax(0, 1fr)' }}>
                            {/* Left: the court, sideways as seen from the sideline, as tall as the screen allows */}
                            <div className="bg-white rounded-lg shadow p-3 flex flex-col gap-2 self-start">
                                <Court onPick={live ? pickCourt : undefined} orientation={courtSide} depth={COURT_DEPTH}
                                    marker={flow?.k === 'vtShot' && flow.x !== null && flow.x !== undefined ? { x: flow.x, y: flow.y } : null}
                                    shots={periodShots.map(s => ({ ...s, key: s.id }))}
                                    style={{ height: 'calc(100vh - 215px)', minHeight: 420, width: 'auto' }} />
                                <div className="flex flex-wrap items-center gap-2 text-sm">
                                    <button className="btn bg-gray-200 text-gray-900" onClick={() => setCourtSide(courtSide === 'left' ? 'right' : 'left')} title="Match the court to your view from the sideline">Flip court ⇄</button>
                                    <button className="btn bg-gray-200 text-gray-900" onClick={shotUnseen} disabled={!canPlay}>Didn't see where<Key k="Q" /></button>
                                </div>
                            </div>

                            {/* Right: what to enter next, then lineup, actions, and recent plays */}
                            <div className="grid gap-3 content-start">
                                {prompt ? (
                                    <div className="rounded-lg shadow p-4 bg-orange-50 border-2 border-orange-300 grid gap-3">
                                        <div className="flex justify-between items-start gap-3">
                                            <div className="text-lg font-semibold">{prompt.title}</div>
                                            {flow.k !== 'afterMake' && <button className="text-sm text-gray-600 underline" onClick={() => setFlow(null)}>Cancel (Esc)</button>}
                                        </div>
                                        {prompt.body}
                                        {prompt.hint && <div className="text-xs text-gray-600">{prompt.hint}</div>}
                                    </div>
                                ) : (
                                    // Between plays: one line with the last entry, so a mistake is easy to spot and undo.
                                    <div className="rounded-lg shadow px-4 py-2 bg-white flex items-center gap-3 text-sm">
                                        {!live ? <span className="text-gray-600">This game has ended. Use Review and Full log to fix anything.</span>
                                            : !periodOpen ? <span className="text-orange-700 font-semibold">Start the next period to continue.</span>
                                            : events.length ? <>
                                                <span className="text-gray-500 shrink-0">Last:</span>
                                                <span className={`truncate ${events[events.length - 1].possVoid ? 'line-through text-gray-400' : 'text-gray-900'}`}>{describe(events[events.length - 1])}</span>
                                                <button className="ml-auto shrink-0 text-gray-600 underline" onClick={undoLast}>Undo</button>
                                            </> : <span className="text-gray-500">Click the court for a VT shot, or use the buttons below.</span>}
                                    </div>
                                )}
                                <div className="bg-white rounded-lg shadow p-3">
                                    <div className="flex justify-between items-center mb-2">
                                        <h3 className="font-semibold">On the floor</h3>
                                        <button className="btn bg-gray-800 text-white" onClick={openSub} disabled={!canPlay}>Sub<Key k="B" /></button>
                                    </div>
                                    <div className="grid grid-cols-5 gap-2 text-sm">
                                        {lineupNow.map((id, i) => <div key={id} className="p-2 rounded bg-gray-100 text-center"><div className="text-gray-500 text-xs">{i + 1}</div>#{id} {last(id)}</div>)}
                                    </div>
                                </div>

                                <div className="bg-white rounded-lg shadow p-3 grid gap-3">
                                    <div>
                                        <h3 className="font-semibold mb-2 flex items-center gap-2"><TeamLogo name="Virginia Tech" size={24} /> Virginia Tech</h3>
                                        <div className="flex flex-wrap gap-2">
                                            <button className="btn bg-orange-600 text-white" onClick={() => startFTs('vt')} disabled={!canPlay}>Free throws<Key k="F" /></button>
                                            <button className="btn bg-orange-600 text-white" onClick={() => begin({ k: 'vtTO', step: 'player' })} disabled={!canPlay}>Turnover<Key k="T" /></button>
                                            <button className="btn bg-orange-100 text-orange-900" onClick={() => simple({ type: 'expired', team: 'vt', poss: 'vt' })} disabled={!canPlay}>Time expired (VT ball)</button>
                                        </div>
                                    </div>
                                    <div>
                                        <h3 className="font-semibold mb-2 flex items-center gap-2"><TeamLogo name={opponent} size={24} /> {opponent}</h3>
                                        <div className="flex flex-wrap gap-2">
                                            <button className="btn bg-blue-600 text-white" onClick={() => oppMade(2)} disabled={!canPlay}>Made 2<Key k="W" /></button>
                                            <button className="btn bg-blue-600 text-white" onClick={() => oppMade(3)} disabled={!canPlay}>Made 3<Key k="E" /></button>
                                            <button className="btn bg-blue-600 text-white" onClick={() => begin({ k: 'oppMiss', step: 'reb' })} disabled={!canPlay}>Missed<Key k="R" /></button>
                                            <button className="btn bg-blue-600 text-white" onClick={() => startFTs('opp')} disabled={!canPlay}>Free throws<Key k="D" /></button>
                                            <button className="btn bg-blue-600 text-white" onClick={() => simple({ type: 'to', team: 'opp', poss: 'opp' })} disabled={!canPlay}>Turnover<Key k="G" /></button>
                                            <button className="btn bg-blue-100 text-blue-900" onClick={() => simple({ type: 'expired', team: 'opp', poss: 'opp' })} disabled={!canPlay}>Time expired ({opponent} ball)</button>
                                        </div>
                                    </div>
                                    <div className="flex flex-wrap gap-2 pt-2 border-t border-gray-200">
                                        <button className="btn bg-gray-100 text-gray-800" onClick={() => simple({ type: 'foul' })} disabled={!canPlay}>Foul on the floor</button>
                                        <button className="btn bg-gray-100 text-gray-800" onClick={didntHappen} disabled={!live}>Didn't happen<Key k="U" /></button>
                                        <button className="btn bg-gray-100 text-gray-800" onClick={undoLast} disabled={!events.length}>Undo last<Key k="Ctrl+Z" /></button>
                                        <button className="btn bg-gray-100 text-gray-800" onClick={() => setModal({ kind: 'adjust' })} disabled={!started}>Fix score</button>
                                    </div>
                                </div>

                                <div className="bg-white rounded-lg shadow p-3">
                                    <h3 className="font-semibold mb-2">Recent plays <span className="text-xs font-normal text-gray-500">(newest first)</span></h3>
                                    <ul className="text-sm divide-y divide-gray-100">
                                        {recent.map(e => (
                                            <li key={e.id} className={`py-1.5 flex justify-between gap-2 ${e.possVoid ? 'text-gray-400 line-through' : ''} ${e.needsPlacement || (e.type === 'shot' && e.team === 'vt' && (e.x === null || e.x === undefined)) ? 'text-amber-700' : ''}`}>
                                                <span>{describe(e)}</span>
                                                {e.type === 'sub' && <button className="text-xs underline text-gray-600 shrink-0" onClick={() => setModal({ kind: 'editSub', sub: e, clock: e.clock === null || e.clock === undefined ? '' : C.formatSeconds(e.clock) })}>Fix time</button>}
                                            </li>
                                        ))}
                                        {!recent.length && <li className="py-2 text-gray-500">Nothing logged yet.</li>}
                                    </ul>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Sub panel */}
                    {subPanel && (
                        <Modal title="Substitution" onClose={() => setSubPanel(null)} wide>
                            <div className="grid grid-cols-2 gap-6">
                                <div>
                                    <h4 className="font-semibold mb-2">Going out</h4>
                                    <div className="grid gap-2">{lineupNow.map(id => (
                                        <button key={id} className={`btn text-left border ${subPanel.out.includes(id) ? 'bg-red-600 text-white border-red-600' : 'bg-white border-gray-300'}`}
                                            onClick={() => setSubPanel(s => ({ ...s, out: s.out.includes(id) ? s.out.filter(x => x !== id) : [...s.out, id] }))}>#{id} {name(id)}</button>))}</div>
                                </div>
                                <div>
                                    <h4 className="font-semibold mb-2">Coming in</h4>
                                    <div className="grid gap-2 max-h-80 overflow-y-auto">{roster.filter(p => !lineupNow.includes(p.id)).map(p => (
                                        <button key={p.id} className={`btn text-left border ${subPanel.in.includes(p.id) ? 'bg-green-600 text-white border-green-600' : 'bg-white border-gray-300'}`}
                                            onClick={() => setSubPanel(s => ({ ...s, in: s.in.includes(p.id) ? s.in.filter(x => x !== p.id) : [...s.in, p.id] }))}>#{p.id} {p.name} <span className="opacity-60">({p.position})</span></button>))}</div>
                                </div>
                            </div>
                            <div className="grid grid-cols-2 gap-6 mt-5 items-start">
                                <div className={subPanel.missed ? 'opacity-40 pointer-events-none' : ''}>
                                    <ClockInput value={subPanel.clock} onChange={(v) => setSubPanel(s => ({ ...s, clock: v }))} onEnter={confirmSub} />
                                </div>
                                <label className="flex gap-2 items-start text-sm p-3 bg-amber-50 rounded border border-amber-200 cursor-pointer">
                                    <input type="checkbox" checked={subPanel.missed} onChange={(e) => setSubPanel(s => ({ ...s, missed: e.target.checked }))} className="mt-1" />
                                    <span><b>I missed this sub.</b> Put him in now, and I'll place when he actually came in from the Review list later.</span>
                                </label>
                            </div>
                            <div className="flex gap-3 mt-6">
                                <button className="btn flex-1 border border-gray-300" onClick={() => setSubPanel(null)}>Cancel</button>
                                <button className="btn flex-1 bg-green-600 text-white" onClick={confirmSub}>Confirm sub (Enter)</button>
                            </div>
                        </Modal>
                    )}

                    {/* Modals */}
                    {modal?.kind === 'startGame' && (
                        <Modal title={`Start game vs ${opponent}`} onClose={() => setModal(null)} wide>
                            {sched?.exhibition && (
                                <div className="mb-5 grid gap-3">
                                    <div className="flex gap-4 text-sm">
                                        <label className="flex items-center gap-2"><input type="radio" checked={!modal.custom} onChange={() => setModal({ ...modal, custom: false })} /> Standard (two 20-minute halves)</label>
                                        <label className="flex items-center gap-2"><input type="radio" checked={modal.custom} onChange={() => setModal({ ...modal, custom: true })} /> Custom periods</label>
                                    </div>
                                    {modal.custom && (
                                        <div className="grid grid-cols-2 gap-3">
                                            <div><label className="block text-sm font-medium mb-1">First period length (minutes)</label>
                                                <input type="number" min="1" value={modal.length} onChange={(e) => setModal({ ...modal, length: e.target.value })} className="w-full p-2 border border-gray-300 rounded-md" /></div>
                                            <div><label className="block text-sm font-medium mb-1">Name (optional)</label>
                                                <input type="text" value={modal.label} placeholder="Period 1" onChange={(e) => setModal({ ...modal, label: e.target.value })} className="w-full p-2 border border-gray-300 rounded-md" /></div>
                                        </div>
                                    )}
                                </div>
                            )}
                            <h4 className="font-semibold mb-2">Starting lineup</h4>
                            <LineupPicker roster={roster} lineup={modal.lineup} setLineup={(l) => setModal({ ...modal, lineup: l })} />
                            <div className="flex gap-3 mt-6">
                                <button className="btn flex-1 border border-gray-300" onClick={() => setModal(null)}>Cancel</button>
                                <button className="btn flex-1 bg-green-600 text-white" onClick={() => confirmStartGame(modal)}>Start game</button>
                            </div>
                        </Modal>
                    )}

                    {modal?.kind === 'startPeriod' && (
                        <Modal title={game.info.custom ? `Start period ${modal.period}` : `Start ${C.STANDARD_PERIODS(modal.period)[modal.period - 1].label}`} onClose={() => setModal(null)} wide>
                            {game.info.custom && (
                                <div className="grid grid-cols-2 gap-3 mb-5">
                                    <div><label className="block text-sm font-medium mb-1">Length (minutes)</label>
                                        <div className="flex gap-2">
                                            <input type="number" min="1" value={modal.length} onChange={(e) => setModal({ ...modal, length: e.target.value })} className="w-24 p-2 border border-gray-300 rounded-md" />
                                            {['6', '10', '20'].map(m => <button key={m} className="btn bg-gray-100" onClick={() => setModal({ ...modal, length: m })}>{m}</button>)}
                                        </div></div>
                                    <div><label className="block text-sm font-medium mb-1">Name</label>
                                        <input type="text" value={modal.label} onChange={(e) => setModal({ ...modal, label: e.target.value })} className="w-full p-2 border border-gray-300 rounded-md" /></div>
                                </div>
                            )}
                            <h4 className="font-semibold mb-2">Lineup to start the period</h4>
                            <LineupPicker roster={roster} lineup={modal.lineup} setLineup={(l) => setModal({ ...modal, lineup: l })} />
                            <div className="flex gap-3 mt-6">
                                <button className="btn flex-1 border border-gray-300" onClick={() => setModal(null)}>Cancel</button>
                                <button className="btn flex-1 bg-green-600 text-white" onClick={() => confirmStartPeriod(modal)}>Start period</button>
                            </div>
                        </Modal>
                    )}

                    {modal?.kind === 'endPeriod' && (
                        <Modal title={`End ${periodOpen?.label}${modal.thenEndGame ? ' and the game' : ''}`} onClose={() => setModal(null)}>
                            <ClockInput label="Time left on the clock" value={modal.clock} onChange={(v) => setModal({ ...modal, clock: v })}
                                onEnter={() => { if (confirmEndPeriod(modal.clock, modal.thenEndGame) && modal.thenEndGame) finishGame(); }} />
                            <p className="text-sm text-gray-600 mt-3">Leave it at 0:00 if the period ran out. If play stopped early (for example at the Under-4), enter the time that was left.</p>
                            <div className="flex gap-3 mt-6">
                                <button className="btn flex-1 border border-gray-300" onClick={() => setModal(null)}>Cancel</button>
                                <button className="btn flex-1 bg-purple-600 text-white" onClick={() => { if (confirmEndPeriod(modal.clock, modal.thenEndGame) && modal.thenEndGame) finishGame(); }}>End period</button>
                            </div>
                        </Modal>
                    )}

                    {modal?.kind === 'garbage' && (
                        <Modal title="When did garbage time start?" onClose={() => setModal(null)}>
                            <ClockInput value={modal.clock} onChange={(v) => setModal({ ...modal, clock: v })} onEnter={() => {}} />
                            <p className="text-sm text-gray-600 mt-3">Everything after this point can be left out on the dashboards with the Garbage Time switch.</p>
                            <div className="flex gap-3 mt-6">
                                <button className="btn flex-1 border border-gray-300" onClick={() => setModal(null)}>Cancel</button>
                                <button className="btn flex-1 bg-amber-600 text-white" onClick={() => {
                                    const clock = parseClock(modal.clock);
                                    if (clock === null) { alert('Enter the game clock.'); return; }
                                    commit({ type: 'garbage', clock }); setModal(null);
                                }}>Mark garbage time</button>
                            </div>
                        </Modal>
                    )}

                    {modal?.kind === 'adjust' && (
                        <Modal title="Fix the score" onClose={() => setModal(null)}>
                            <p className="text-sm text-gray-600 mb-4">Use this only if the score is off and you can't find the play to fix. It adds a correction to the log.</p>
                            {['vt', 'opp'].map(team => (
                                <div key={team} className="flex items-center gap-3 mb-3">
                                    <span className="w-40 font-medium">{team === 'vt' ? 'Virginia Tech' : opponent}</span>
                                    {[-1, 1].map(pts => <button key={pts} className="btn bg-gray-100" onClick={() => { commit({ type: 'adjust', team, pts }); showToast(`Score corrected: ${team === 'vt' ? 'VT' : opponent} ${pts > 0 ? '+1' : '−1'}`); }}>{pts > 0 ? '+1' : '−1'}</button>)}
                                </div>
                            ))}
                            <button className="btn w-full border border-gray-300 mt-3" onClick={() => setModal(null)}>Done</button>
                        </Modal>
                    )}

                    {modal?.kind === 'editSub' && (
                        <Modal title="Fix sub time" onClose={() => setModal(null)}>
                            <p className="mb-3 text-sm">{describe(modal.sub)}</p>
                            <ClockInput value={modal.clock} onChange={(v) => setModal({ ...modal, clock: v })} onEnter={() => {}} />
                            <div className="flex gap-3 mt-6">
                                <button className="btn border border-red-300 text-red-700" onClick={() => { if (window.confirm('Delete this sub?')) { deleteEvent(modal.sub.id); setModal(null); } }}>Delete sub</button>
                                <div className="flex-1"></div>
                                <button className="btn border border-gray-300" onClick={() => setModal(null)}>Cancel</button>
                                <button className="btn bg-green-600 text-white" onClick={() => {
                                    const clock = parseClock(modal.clock);
                                    if (clock === null) { alert('Enter the game clock.'); return; }
                                    patchEvent(modal.sub.id, { clock }); setModal(null);
                                }}>Save time</button>
                            </div>
                        </Modal>
                    )}

                    {modal?.kind === 'review' && built && (
                        <ReviewModal built={built} events={events} roster={roster} describe={describe} opponent={opponent} courtSide={courtSide}
                            onClose={() => setModal(null)} patchEvent={patchEvent} placeSub={placeSub} />
                    )}

                    {modal?.kind === 'log' && built && (
                        <LogModal events={events} describe={describe} onClose={() => setModal(null)} deleteEvent={deleteEvent}
                            patchEvent={patchEvent} editSub={(e) => setModal({ kind: 'editSub', sub: e, clock: e.clock === null || e.clock === undefined ? '' : C.formatSeconds(e.clock) })} />
                    )}

                    {toast && (
                        <div className="fixed bottom-4 left-1/2 -translate-x-1/2 bg-gray-900 text-white text-sm px-4 py-3 rounded-lg shadow-lg flex items-center gap-4 z-50 max-w-xl">
                            <span>{toast.text}</span>
                            {toast.action && <button className="underline font-semibold shrink-0" onClick={() => { toast.action.run(); setToast(null); }}>{toast.action.label}</button>}
                        </div>
                    )}

                    <details className="mt-3 text-xs text-gray-600 bg-white rounded-lg shadow p-3">
                        <summary className="cursor-pointer font-semibold">Keyboard shortcuts</summary>
                        <div className="grid grid-cols-3 gap-2 mt-2">
                            <div><b>VT</b>: click court = shot · Q shot (spot not seen) · 1–5 player · M make · X miss · P switch 2/3 · A and-1 · F free throws · T turnover</div>
                            <div><b>{opponent}</b>: W made 2 · E made 3 · R missed · D free throws · S and-1 · G turnover</div>
                            <div><b>Rebounds</b>: V VT · O {opponent} · N none, then V / O / K (time expired). <b>Other</b>: B sub · U didn't happen · Ctrl+Z undo · Esc cancel</div>
                        </div>
                    </details>
                </div>
            );
        };

        // Lists everything that still needs attention: shots with no spot, subs with no placement.
        const ReviewModal = ({ built, events, roster, describe, onClose, patchEvent, placeSub, courtSide }) => {
            const [placingShot, setPlacingShot] = useState(null);
            const [placingSub, setPlacingSub] = useState(null);   // { sub, before, clock }
            const unseen = built.review.unseenShots, unplaced = built.review.unplacedSubs;
            const name = (id) => roster.find(p => p.id === id)?.name || `#${id}`;
            if (placingShot) {
                const s = events.find(e => e.id === placingShot.id) || placingShot;
                const geo = s.x !== null && s.x !== undefined ? (C.isThree(s.x, s.y) ? 3 : 2) : null;
                return (
                    <Modal title="Where was this shot taken?" onClose={() => setPlacingShot(null)} wide>
                        <p className="mb-3">{describe(s)}</p>
                        <div style={{ maxWidth: 560 }}>
                            <Court orientation={courtSide} depth={COURT_DEPTH} style={{ maxHeight: "60vh", width: "auto", margin: "0 auto" }} onPick={(x, y) => patchEvent(s.id, { x, y })} marker={s.x !== null && s.x !== undefined ? { x: s.x, y: s.y } : null} />
                        </div>
                        {geo !== null && geo !== s.pts && (
                            <div className="mt-3 p-3 rounded bg-amber-50 border border-amber-200 text-sm flex items-center gap-3">
                                That spot is a {geo}-pointer, but the shot was logged as a {s.pts}.
                                <button className="btn bg-amber-600 text-white" onClick={() => patchEvent(s.id, { pts: geo })}>Change to {geo}</button>
                            </div>
                        )}
                        <div className="flex gap-3 mt-5">
                            <div className="flex-1"></div>
                            <button className="btn bg-green-600 text-white" onClick={() => setPlacingShot(null)}>Done</button>
                        </div>
                    </Modal>
                );
            }
            if (placingSub) {
                const { sub } = placingSub;
                const before = events.filter(e => e.seq < sub.seq && e.type !== 'period_end');
                const periodStart = [...before].reverse().find(e => e.type === 'period_start');
                const choices = before.filter(e => e.seq > (periodStart?.seq ?? 0));
                return (
                    <Modal title={`When did ${(sub.in || []).map(name).join(', ')} come in?`} onClose={() => setPlacingSub(null)} wide>
                        <p className="text-sm text-gray-600 mb-3">Pick the first play he was on the floor for. Plays from that point on will be credited to the corrected lineup.</p>
                        <div className="max-h-72 overflow-y-auto border border-gray-200 rounded mb-4">
                            {choices.map(e => (
                                <label key={e.id} className={`flex gap-3 items-center px-3 py-2 text-sm border-b border-gray-100 cursor-pointer ${placingSub.before?.id === e.id ? 'bg-green-50' : ''}`}>
                                    <input type="radio" checked={placingSub.before?.id === e.id} onChange={() => setPlacingSub({ ...placingSub, before: e })} />
                                    {describe(e)}
                                </label>
                            ))}
                            <label className={`flex gap-3 items-center px-3 py-2 text-sm cursor-pointer ${placingSub.before?.id === sub.id ? 'bg-green-50' : ''}`}>
                                <input type="radio" checked={placingSub.before?.id === sub.id} onChange={() => setPlacingSub({ ...placingSub, before: sub })} />
                                <i>Right where I entered it</i>
                            </label>
                        </div>
                        <ClockInput value={placingSub.clock} onChange={(v) => setPlacingSub({ ...placingSub, clock: v })} onEnter={() => {}} autoFocus={false} label="Game clock when he came in" />
                        <div className="flex gap-3 mt-5">
                            <div className="flex-1"></div>
                            <button className="btn border border-gray-300" onClick={() => setPlacingSub(null)}>Cancel</button>
                            <button className="btn bg-green-600 text-white" disabled={!placingSub.before} onClick={() => {
                                if (placingSub.before.id === sub.id) {
                                    const clock = parseClock(placingSub.clock);
                                    if (clock === null) { alert('Enter the game clock when he came in.'); return; }
                                    patchEvent(sub.id, { clock, needsPlacement: null }); setPlacingSub(null); return;
                                }
                                if (placeSub(sub, placingSub.before, placingSub.clock)) setPlacingSub(null);
                            }}>Place sub</button>
                        </div>
                    </Modal>
                );
            }
            return (
                <Modal title="Review" onClose={onClose} wide>
                    {!unseen.length && !unplaced.length && <p className="text-green-700 font-medium">Nothing to review. Every shot has a spot and every sub is placed.</p>}
                    {unplaced.length > 0 && (
                        <div className="mb-6">
                            <h4 className="font-semibold mb-2">Subs to place ({unplaced.length})</h4>
                            <ul className="divide-y divide-gray-100 border border-gray-200 rounded">
                                {unplaced.map(s => (
                                    <li key={s.id} className="flex justify-between items-center px-3 py-2 text-sm">
                                        {describe(s)}
                                        <button className="btn bg-amber-600 text-white" onClick={() => setPlacingSub({ sub: s, before: null, clock: '' })}>Place</button>
                                    </li>
                                ))}
                            </ul>
                        </div>
                    )}
                    {unseen.length > 0 && (
                        <div>
                            <h4 className="font-semibold mb-2">Shots without a spot ({unseen.length})</h4>
                            <ul className="divide-y divide-gray-100 border border-gray-200 rounded">
                                {unseen.map(s => (
                                    <li key={s.id} className="flex justify-between items-center px-3 py-2 text-sm">
                                        {describe(s)}
                                        <button className="btn bg-amber-600 text-white" onClick={() => setPlacingShot(s)}>Mark spot</button>
                                    </li>
                                ))}
                            </ul>
                        </div>
                    )}
                    <button className="btn w-full border border-gray-300 mt-6" onClick={onClose}>Close</button>
                </Modal>
            );
        };

        // Every entry, grouped by period, with fixes.
        const LogModal = ({ events, describe, onClose, deleteEvent, patchEvent, editSub }) => (
            <Modal title="Full log" onClose={onClose} wide>
                <ul className="text-sm divide-y divide-gray-100 border border-gray-200 rounded">
                    {events.map(e => (
                        <li key={e.id} className={`flex justify-between items-center gap-3 px-3 py-1.5 ${e.type === 'period_start' ? 'bg-gray-50 font-semibold' : ''} ${e.possVoid ? 'text-gray-400' : ''}`}>
                            <span>{describe(e)}{e.possVoid ? ' (possession removed)' : ''}</span>
                            <span className="flex gap-3 shrink-0 text-xs">
                                {e.type === 'sub' && <button className="underline" onClick={() => editSub(e)}>Fix time</button>}
                                {e.poss && <button className="underline" onClick={() => patchEvent(e.id, { possVoid: e.possVoid ? null : true })}>{e.possVoid ? 'Count possession' : "Didn't happen"}</button>}
                                {e.type !== 'period_start' && e.type !== 'period_end' && <button className="underline text-red-700" onClick={() => { if (window.confirm(`Delete "${describe(e)}"?`)) deleteEvent(e.id); }}>Delete</button>}
                            </span>
                        </li>
                    ))}
                </ul>
                <button className="btn w-full border border-gray-300 mt-4" onClick={onClose}>Close</button>
            </Modal>
        );

        // Sign-in (only when INPUT_SIGN_IN.enabled in config.js)
        const SignInGate = ({ children }) => {
            const [user, setUser] = useState(undefined);
            const [password, setPassword] = useState('');
            const [email, setEmail] = useState(CFG.INPUT_SIGN_IN.email || '');
            const [error, setError] = useState('');
            useEffect(() => {
                let unsub;
                const wait = setInterval(() => { if (!window.firebaseAuth) return; clearInterval(wait); unsub = window.firebaseAuth.onChange(setUser); }, 50);
                return () => { clearInterval(wait); unsub && unsub(); };
            }, []);
            if (user === undefined) return <div className="p-8 text-gray-500">Loading…</div>;
            if (user) return <>{children}<div className="text-center text-xs text-gray-500 pb-4">Signed in as {user} · <button className="underline" onClick={() => window.confirm('Sign out on this device?') && window.firebaseAuth.signOut()}>Sign out</button></div></>;
            return (
                <div className="min-h-screen flex items-center justify-center p-4">
                    <form className="bg-white rounded-lg shadow-lg p-8 w-full max-w-sm grid gap-4" onSubmit={async (e) => {
                        e.preventDefault(); setError('');
                        try { await window.firebaseAuth.signIn(email.trim(), password); } catch (err) { setError(err.code === 'auth/network-request-failed' ? 'No connection. Sign in once you have internet.' : 'Wrong password.'); }
                    }}>
                        <h1 className="text-2xl font-bold">VT Lineup Tracker</h1>
                        <p className="text-sm text-gray-600">Sign in once on this computer. You'll stay signed in.</p>
                        {!CFG.INPUT_SIGN_IN.email && <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} placeholder="Email" className="p-3 border border-gray-300 rounded-md" />}
                        <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} placeholder="Password" autoFocus className="p-3 border border-gray-300 rounded-md" />
                        {error && <p className="text-sm text-red-600">{error}</p>}
                        <button className="btn bg-orange-600 text-white py-3">Sign in</button>
                    </form>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(
            CFG.INPUT_SIGN_IN.enabled ? <SignInGate><Tracker /></SignInGate> : <Tracker />
        );
    </script>
</body>
</html>
