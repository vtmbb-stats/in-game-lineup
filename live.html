<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VT Basketball Gameday Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .custom-green-100 { background-color: #00A327; }
        .custom-green-50 { background-color: #66C47E; }
        .custom-red-50 { background-color: #E06060; }
        .custom-red-100 { background-color: #DB2800; }
    </style>
    <script type="module" src="firebase.js"></script>
    <script src="config.js"></script>
    <script src="lineup-core.js"></script>
    <script src="play-log.js"></script>
</head>
<body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
    <script type="text/babel" src="ui.jsx"></script>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const C = window.LineupCore;
        const CFG = window.VT_CONFIG;
        const { Nav, DarkToggle, Toggle, Select, StatsTable, PlayerList, Warnings, useSort, useAvailability } = window.UI;

        const TIMEFRAMES = [
            { value: 'this-game', label: 'This Game' },
            { value: 'last-5', label: 'Last 5 Games + This Game' },
            { value: 'last-10', label: 'Last 10 Games + This Game' },
            { value: 'conference', label: 'ACC Games + This Game' },
            { value: 'season', label: 'Season + This Game' }
        ];

        // Subscribe to a database path; returns its latest value (null until loaded / if empty).
        const useWatch = (path) => {
            const [value, setValue] = useState(null);
            useEffect(() => {
                setValue(null);
                if (!path) return;
                let unsub;
                C.db().then(db => { unsub = db.watch(path, setValue); });
                return () => unsub && unsub();
            }, [path]);
            return value;
        };

        const GamedayAnalyticsDisplay = () => {
            const [darkMode, setDarkMode] = useState(true);
            const [timeframe, setTimeframe] = useState('this-game');
            const [includeGarbageTime, setIncludeGarbageTime] = useState(true);
            const [priorGames, setPriorGames] = useState([]);
            const sort = useSort('plusMinus');
            const { availability, toggle, isAvailable } = useAvailability();

            // Find the game that's currently in progress (latest date if somehow more than one).
            // Games with no activity for STALE_HOURS are ignored, so a game someone forgot to
            // end doesn't take over this page forever.
            const allInfo = useWatch('game-info');
            const [now, setNow] = useState(Date.now());
            useEffect(() => { const t = setInterval(() => setNow(Date.now()), 60 * 1000); return () => clearInterval(t); }, []);
            const liveDate = useMemo(() => {
                const STALE_HOURS = 12;
                const lastActivity = (i) => Math.max(Date.parse(i.lastUpdated) || 0, Date.parse(i.startTime) || 0);
                const live = Object.entries(allInfo || {})
                    .filter(([, i]) => i?.started && !i.ended && now - lastActivity(i) < STALE_HOURS * 3600 * 1000)
                    .map(([d]) => d).sort();
                return live.length ? live[live.length - 1] : null;
            }, [allInfo, now]);

            const info = allInfo?.[liveDate] || null;
            const v2 = info?.format === 2;
            const live = useWatch(liveDate && !v2 && `live-game/${liveDate}`);
            const rawHistory = useWatch(liveDate && C.dataPath(info, liveDate));
            const currentStats = useWatch(liveDate && !v2 && `current-stats/${liveDate}`);

            const game = liveDate ? CFG.findGame(liveDate) : null;
            const opponent = game?.opponent || info?.opponent || 'Opponent';
            const roster = useMemo(() => CFG.rosterForDate(liveDate), [liveDate]);

            // Earlier games this season, for the multi-game timeframes.
            useEffect(() => {
                setPriorGames([]);
                if (!liveDate) return;
                const season = CFG.seasonForDate(liveDate) || CFG.CURRENT_SEASON;
                const earlier = CFG.gamesForSeason(season).filter(g => g.date < liveDate);
                C.loadGames(earlier).then(games => setPriorGames(C.filterGames(games)));
            }, [liveDate]);

            const legacyLineupStr = live?.currentLineup || info?.currentLineup;
            const legacyVt = live?.vtScore ?? info?.vtScore ?? 0;
            const legacyOpp = live?.oppScore ?? info?.oppScore ?? 0;

            const built = useMemo(() => C.buildGame(info, rawHistory, roster, {
                current: true,
                legacyCurrent: { lineup: legacyLineupStr, vtScore: legacyVt, oppScore: legacyOpp, stats: currentStats }
            }), [info, rawHistory, roster, legacyLineupStr, legacyVt, legacyOpp, currentStats]);
            const { segments, warnings } = built;
            const currentIds = v2 ? (built.lineup || []) : C.namesToIds(legacyLineupStr, roster);
            const vtScore = v2 ? built.displayScore.vt : legacyVt;
            const oppScore = v2 ? built.displayScore.opp : legacyOpp;

            const keep = (seg) => (includeGarbageTime || !seg.isGarbageTime) && seg.lineup.every(isAvailable);
            const gameSegments = segments.filter(s => includeGarbageTime || !s.isGarbageTime);
            const playerTotals = C.playerTotals(gameSegments);

            const rows = useMemo(() => {
                let baseline = [];
                if (timeframe !== 'this-game') {
                    let games = priorGames;
                    if (timeframe === 'conference') games = games.filter(g => g.conference);
                    if (timeframe === 'last-5') games = games.slice(-5);
                    if (timeframe === 'last-10') games = games.slice(-10);
                    baseline = games.flatMap(g => g.built.segments);
                }
                return C.aggregateLineups([...baseline, ...segments].filter(keep), roster);
            }, [timeframe, priorGames, segments, includeGarbageTime, availability, roster]);

            const half = live?.currentHalf || info?.currentHalf || 1;
            const periodText = v2 ? C.periodLabelOf(info, built.period || 1) : `${live?.gameTime || info?.gameTime || '20:00'} ${C.periodLabel(half)}`;
            const textMain = darkMode ? 'text-white' : 'text-gray-900';

            if (!liveDate) {
                return (
                    <div className={`min-h-screen flex flex-col items-center justify-center gap-6 ${darkMode ? 'bg-gray-900' : 'bg-gray-100'}`}>
                        <div className="text-center">
                            <h1 className={`text-4xl font-bold mb-4 ${textMain}`}>{allInfo === null ? 'Loading…' : 'No Game Live'}</h1>
                            <p className={`text-lg ${darkMode ? 'text-gray-400' : 'text-gray-600'}`}>Start a game from the input app to view live analytics</p>
                        </div>
                        <Nav current="live.html" darkMode={darkMode} />
                    </div>
                );
            }

            return (
                <div className={`min-h-screen ${darkMode ? 'bg-gray-900' : 'bg-gray-100'}`}>
                    <div className={`p-4 border-b ${darkMode ? 'border-gray-700' : 'border-gray-300'}`}>
                        <div className="flex flex-wrap justify-between items-center gap-3 mb-3">
                            <div>
                                <h1 className={`text-2xl font-bold ${textMain}`}>VT Basketball Analytics</h1>
                                <p className={`text-sm mt-1 ${darkMode ? 'text-green-400' : 'text-green-600'}`}>
                                    Live vs {opponent} — VT {vtScore}, {opponent} {oppScore} · {periodText}
                                </p>
                            </div>
                            <Nav current="live.html" darkMode={darkMode} />
                        </div>
                        <div className="flex flex-wrap justify-end items-center gap-4">
                            <Select value={timeframe} onChange={setTimeframe} darkMode={darkMode}>
                                {TIMEFRAMES.map(tf => <option key={tf.value} value={tf.value}>{tf.label}</option>)}
                            </Select>
                            <Toggle label="Garbage Time" value={includeGarbageTime} onChange={setIncludeGarbageTime} darkMode={darkMode} />
                            <DarkToggle darkMode={darkMode} setDarkMode={setDarkMode} />
                        </div>
                    </div>

                    <div className={`p-4 border-b ${darkMode ? 'border-gray-700' : 'border-gray-300'}`}>
                        <h2 className={`text-lg font-semibold mb-3 ${textMain}`}>On the Floor — game +/-</h2>
                        <div className="grid grid-cols-5 gap-4">
                            {currentIds.map(id => {
                                const t = playerTotals[id] || { plusMinus: 0, seconds: 0 };
                                return (
                                    <div key={id} className={`p-3 rounded-lg text-center shadow ${darkMode ? 'bg-gray-800' : 'bg-white'}`}>
                                        <div className={`text-lg font-bold ${textMain}`}>#{id} {C.lastName(id, roster)}</div>
                                        <div className={`text-xl font-bold ${t.plusMinus >= 0 ? 'text-green-500' : 'text-red-500'}`}>{C.fmtPM(t.plusMinus)}</div>
                                        <div className={`text-xs ${darkMode ? 'text-gray-400' : 'text-gray-600'}`}>{C.formatSeconds(t.seconds)}+ min</div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>

                    <div className="flex">
                        <div className={`w-64 p-4 border-r ${darkMode ? 'bg-gray-800 border-gray-700' : 'bg-white border-gray-300'}`}>
                            <PlayerList title="Bench" players={roster.filter(p => !currentIds.includes(p.id))}
                                totals={playerTotals} availability={availability} onToggle={toggle} darkMode={darkMode} />
                        </div>
                        <div className="flex-1 p-4">
                            <Warnings warnings={warnings} darkMode={darkMode} />
                            <div className={`rounded-lg shadow p-4 ${darkMode ? 'bg-gray-800' : 'bg-white'}`}>
                                <h3 className={`text-lg font-semibold mb-4 ${textMain}`}>
                                    Lineup Analytics — {TIMEFRAMES.find(tf => tf.value === timeframe)?.label}
                                </h3>
                                <StatsTable rows={rows} darkMode={darkMode} {...sort} />
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<GamedayAnalyticsDisplay />);
    </script>
</body>
</html>
