<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VT Basketball Combinations</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .custom-green-100{background-color:#00A327}
    .custom-green-50{background-color:#66C47E}
    .custom-red-50{background-color:#E06060}
    .custom-red-100{background-color:#DB2800}
  </style>
  <script type="module" src="firebase.js"></script>
  <script src="config.js"></script>
  <script src="lineup-core.js"></script>
  <script src="play-log.js"></script>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
  <script type="text/babel" src="ui.jsx"></script>

  <script type="text/babel">
    const { useState, useMemo } = React;
    const C = window.LineupCore;
    const { PageHeader, RangeFilters, Card, Select, StatsTable, Warnings, useSort, useSeasonGames, collectSelected, LINEUP_COLUMNS } = window.UI;

    const pairs = (list) => list.flatMap((a, i) => list.slice(i + 1).map(b => [a, b]));
    const PM_PER_MIN = { key: 'pmPerMinute', label: '+/- per min', render: r => C.fmt(r.pmPerMinute, 2) };
    const COMBO_COLUMNS = [LINEUP_COLUMNS[0], PM_PER_MIN, ...LINEUP_COLUMNS.slice(1)];
    const COL = Object.fromEntries(COMBO_COLUMNS.map(c => [c.key, c]));
    const GUARD_COLUMNS = [COL.plusMinus, COL.pmPerMinute, COL.pointsPerPossession, COL.defPointsPerPossession, COL.turnoverRate, COL.minutes];
    const BIG_COLUMNS = [COL.plusMinus, COL.pmPerMinute, COL.offRebRate, COL.defRebRate, COL.minutes];

    const CombinationsPage = () => {
      const [darkMode, setDarkMode] = useState(true);
      const sg = useSeasonGames();
      const [size, setSize] = useState('2');
      const [mustInclude, setMustInclude] = useState([]);
      const [minMinutes, setMinMinutes] = useState('5');
      const comboSort = useSort('plusMinus');
      const guardSort = useSort('plusMinus');
      const bigSort = useSort('plusMinus');
      const roster = sg.roster;
      const name = (id) => roster.find(p => p.id === id)?.name || `#${id}`;
      const shortNames = (ids) => [...ids].sort((a, b) => roster.findIndex(p => p.id === a) - roster.findIndex(p => p.id === b)).map(id => C.lastName(id, roster)).join(', ');

      const { segments, warnings } = useMemo(() => collectSelected(sg), [sg.selected, sg.filters.includeGarbageTime]);

      // Any k-man group that shared the floor
      const comboRows = useMemo(() => C.comboTotals(segments, +size)
        .map(r => ({ ...r, id: r.players.join('-'), names: shortNames(r.players) }))
        .filter(r => mustInclude.every(id => r.players.includes(id))), [segments, size, mustInclude, roster]);
      const shownCombos = comboRows.filter(r => r.seconds >= +minMinutes * 60);

      // Guard pairs and big pairs (flex forwards count as bigs only per LineupCore.isBigInLineup)
      const { guardRows, bigRows } = useMemo(() => {
        const row = (pair, include) => ({ ...C.groupTotals(segments, pair, include), id: pair.join('-'), names: pair.map(name).join(' & ') });
        const guards = roster.filter(p => p.position === 'G').map(p => p.id);
        const bigs = roster.filter(p => p.position !== 'G').map(p => p.id);
        return {
          guardRows: pairs(guards).map(pair => row(pair)).filter(r => r.seconds > 0),
          bigRows: pairs(bigs).map(pair => row(pair, (lineup) => pair.every(id => lineup.includes(id) && C.isBigInLineup(id, lineup, roster)))).filter(r => r.seconds > 0)
        };
      }, [segments, roster]);

      const toggleInclude = (id) => setMustInclude(prev => prev.includes(id) ? prev.filter(p => p !== id) : [...prev, id].slice(0, +size));
      const textMain = darkMode ? 'text-white' : 'text-gray-900';
      const flexNames = roster.filter(p => p.flexBig).map(p => C.lastName(p.id, roster)).join(', ');

      return (
        <div className={`min-h-screen ${darkMode ? 'bg-gray-900' : 'bg-gray-100'}`}>
          <PageHeader title="Combinations" current="combinations.html" darkMode={darkMode} setDarkMode={setDarkMode}>
            <RangeFilters sg={sg} darkMode={darkMode} />
          </PageHeader>

          {sg.loading ? (
            <div className={`flex justify-center items-center h-64 text-xl ${textMain}`}>Loading games…</div>
          ) : (
            <div className="p-4 grid gap-4">
              <Warnings warnings={warnings} darkMode={darkMode} />
              <Card darkMode={darkMode} title="Player combinations within lineups"
                right={`${shownCombos.length} of ${comboRows.length} groups`}>
                <div className="flex flex-wrap items-center gap-4 mb-4">
                  <Select label="Group size" value={size} onChange={(v) => { setSize(v); setMustInclude(m => m.slice(0, +v)); }} darkMode={darkMode}>
                    <option value="2">2 players</option><option value="3">3 players</option><option value="4">4 players</option>
                  </Select>
                  <Select label="Min. minutes together" value={minMinutes} onChange={setMinMinutes} darkMode={darkMode}>
                    {['0', '2', '5', '10', '20', '40'].map(m => <option key={m} value={m}>{m}</option>)}
                  </Select>
                  <div className="flex flex-wrap items-center gap-1">
                    <span className={`text-sm mr-1 ${darkMode ? 'text-gray-300' : 'text-gray-700'}`}>Must include:</span>
                    {roster.map(p => (
                      <button key={p.id} onClick={() => toggleInclude(p.id)} title={p.name}
                        className={`px-2 py-1 rounded text-xs font-medium ${mustInclude.includes(p.id) ? 'bg-blue-600 text-white' : (darkMode ? 'bg-gray-700 text-gray-300 hover:bg-gray-600' : 'bg-gray-100 text-gray-700 hover:bg-gray-200')}`}>
                        #{p.id} {C.lastName(p.id, roster)}
                      </button>
                    ))}
                    {mustInclude.length > 0 && <button onClick={() => setMustInclude([])} className="text-xs px-2 py-1 rounded bg-red-600 text-white ml-1">Clear</button>}
                  </div>
                </div>
                <StatsTable rows={shownCombos} columns={COMBO_COLUMNS} nameLabel="Players" darkMode={darkMode} {...comboSort}
                  emptyText="No groups match these filters" />
              </Card>

              <div className="grid gap-4" style={{ gridTemplateColumns: 'repeat(auto-fit, minmax(520px, 1fr))' }}>
                <Card darkMode={darkMode} title="Guard pairs">
                  <StatsTable rows={guardRows} columns={GUARD_COLUMNS} nameLabel="Pair" darkMode={darkMode} {...guardSort} emptyText="No guard pairs in these games" />
                </Card>
                <Card darkMode={darkMode} title="Big pairs" right={flexNames ? `${flexNames} count as bigs unless two or more players listed below them on the roster are on the floor` : null}>
                  <StatsTable rows={bigRows} columns={BIG_COLUMNS} nameLabel="Pair" darkMode={darkMode} {...bigSort} emptyText="No big pairs in these games" />
                </Card>
              </div>
            </div>
          )}
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<CombinationsPage />);
  </script>
</body>
</html>
