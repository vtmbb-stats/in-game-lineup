<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VT Basketball Specific Combos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .custom-green-100{background-color:#00A327}
    .custom-green-50{background-color:#66C47E}
    .custom-red-50{background-color:#E06060}
    .custom-red-100{background-color:#DB2800}
  </style>
  <script type="module" src="firebase.js"></script>
  <script src="config.js"></script>
  <script src="lineup-core.js"></script>
  <script src="play-log.js"></script>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
  <script type="text/babel" src="ui.jsx"></script>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;
    const C = window.LineupCore;
    const CFG = window.VT_CONFIG;
    const { Nav, DarkToggle, Toggle, Select, StatsTable, Warnings, useSort, minutesText } = window.UI;

    const pairs = (list) => list.flatMap((a, i) => list.slice(i + 1).map(b => [a, b]));

    const COL = {
      plusMinus: { key: 'plusMinus', label: '+/-', render: r => C.fmtPM(r.plusMinus) },
      pmPerMinute: { key: 'pmPerMinute', label: '+/- per min', render: r => C.fmt(r.pmPerMinute, 2) },
      offRebRate: { key: 'offRebRate', label: 'OReb%', render: r => C.fmt(r.offRebRate, 1, '%') },
      defRebRate: { key: 'defRebRate', label: 'DReb%', render: r => C.fmt(r.defRebRate, 1, '%') },
      turnoverRate: { key: 'turnoverRate', label: 'TO%', render: r => C.fmt(r.turnoverRate, 1, '%') },
      defTurnoverRate: { key: 'defTurnoverRate', label: 'Def TO%', render: r => C.fmt(r.defTurnoverRate, 1, '%') },
      minutes: { key: 'minutes', label: 'Min', render: minutesText }
    };
    const GUARD_COLUMNS = [COL.plusMinus, COL.pmPerMinute, COL.minutes];
    const BIG_COLUMNS = [COL.plusMinus, COL.pmPerMinute, COL.offRebRate, COL.defRebRate, COL.minutes];
    const THREE_COLUMNS = [COL.plusMinus, COL.pmPerMinute, COL.offRebRate, COL.defRebRate, COL.turnoverRate, COL.defTurnoverRate, COL.minutes];

    const MIN_THREE_MAN_SECONDS = 5 * 60;

    const pickDefaultSeason = (allInfo) =>
      CFG.seasonKeys.find(key => CFG.gamesForSeason(key).some(g => allInfo?.[g.date]?.started)) || CFG.CURRENT_SEASON;

    const Section = ({ title, note, darkMode, children }) => (
      <div>
        <div className="flex items-baseline justify-between mb-3">
          <h2 className={`text-xl font-bold ${darkMode ? 'text-white' : 'text-gray-900'}`}>{title}</h2>
          {note && <span className={`text-xs ${darkMode ? 'text-gray-400' : 'text-gray-500'}`}>{note}</span>}
        </div>
        <div className={`rounded-lg shadow p-2 ${darkMode ? 'bg-gray-800' : 'bg-white'}`}>{children}</div>
      </div>
    );

    const SpecificCombosViewer = () => {
      const [darkMode, setDarkMode] = useState(true);
      const [season, setSeason] = useState(null);
      const [games, setGames] = useState(null);
      const [from, setFrom] = useState('');
      const [to, setTo] = useState('');
      const [includeGarbageTime, setIncludeGarbageTime] = useState(true);
      const [includeLosses, setIncludeLosses] = useState(true);
      const [highMajorOnly, setHighMajorOnly] = useState(false);
      const [conferenceOnly, setConferenceOnly] = useState(false);
      const guardSort = useSort('plusMinus');
      const bigSort = useSort('plusMinus');
      const threeSort = useSort('plusMinus');

      useEffect(() => {
        C.db().then(db => db.read('game-info')).then(all => setSeason(pickDefaultSeason(all)));
      }, []);

      useEffect(() => {
        if (!season) return;
        setGames(null);
        C.loadGames(CFG.gamesForSeason(season)).then(loaded => {
          const real = loaded.filter(g => !g.exhibition);
          setGames(loaded);
          setFrom(real[0]?.date || '');
          setTo(real[real.length - 1]?.date || '');
        });
      }, [season]);

      const roster = CFG.rosterForSeason(season);
      const name = (id) => roster.find(p => p.id === id)?.name || `#${id}`;

      const { segments, warnings } = useMemo(() => {
        const segs = [], warns = [];
        C.filterGames(games || [], { from, to, includeLosses, highMajorOnly, conferenceOnly }).forEach(g => {
          const built = g.built;
          segs.push(...built.segments);
          warns.push(...built.warnings.map(w => `${g.displayName}: ${w}`));
        });
        return { segments: segs.filter(s => includeGarbageTime || !s.isGarbageTime), warnings: warns };
      }, [games, roster, from, to, includeLosses, highMajorOnly, conferenceOnly, includeGarbageTime]);

      const { guardRows, bigRows, hiddenGuards, hiddenBigs } = useMemo(() => {
        const guards = roster.filter(p => p.position === 'G').map(p => p.id);
        const bigs = roster.filter(p => p.position === 'F' || p.position === 'C');
        const row = (pair, include) => ({ ...C.groupTotals(segments, pair, include), id: pair.join('-'), names: pair.map(name).join(' & ') });

        const g = pairs(guards).map(pair => row(pair));
        // A big pairing counts only when both players are playing as bigs in that five
        // (flex forwards: exactly one teammate below them on the roster — see LineupCore.isBigInLineup).
        const b = pairs(bigs.map(p => p.id)).map(pair => row(pair, (lineup) =>
          pair.every(id => lineup.includes(id) && C.isBigInLineup(id, lineup, roster))
        ));
        return {
          guardRows: g.filter(r => r.seconds > 0), hiddenGuards: g.filter(r => r.seconds === 0).length,
          bigRows: b.filter(r => r.seconds > 0), hiddenBigs: b.filter(r => r.seconds === 0).length
        };
      }, [segments, roster]);

      const threeRows = useMemo(() =>
        C.comboTotals(segments, 3)
          .filter(r => r.seconds >= MIN_THREE_MAN_SECONDS)
          .map(r => ({ ...r, id: r.players.join('-'), names: r.players.map(name).join(', ') })),
      [segments, roster]);

      const textMain = darkMode ? 'text-white' : 'text-gray-900';
      const gameOptions = (games || []).filter(g => !g.exhibition);
      const flexNames = roster.filter(p => p.flexBig).map(p => p.name).join(', ');

      return (
        <div className={`min-h-screen ${darkMode ? 'bg-gray-900' : 'bg-gray-100'}`}>
          <div className={`p-4 border-b ${darkMode ? 'border-gray-700' : 'border-gray-300'}`}>
            <div className="flex flex-wrap justify-between items-center gap-3 mb-4">
              <h1 className={`text-2xl font-bold ${textMain}`}>Virginia Tech Basketball Guard/Big Combinations</h1>
              <div className="flex items-center gap-3">
                <Nav current="combinations.html" darkMode={darkMode} />
                <DarkToggle darkMode={darkMode} setDarkMode={setDarkMode} />
              </div>
            </div>
            <div className="flex flex-wrap justify-end items-center gap-4">
              <Select label="Season" value={season || ''} onChange={setSeason} darkMode={darkMode}>
                {CFG.seasonKeys.map(k => <option key={k} value={k}>{CFG.SEASONS[k].label}</option>)}
              </Select>
              <Select label="From" value={from} onChange={setFrom} darkMode={darkMode}>
                {gameOptions.map(g => <option key={g.date} value={g.date}>{g.displayName}</option>)}
              </Select>
              <Select label="To" value={to} onChange={setTo} darkMode={darkMode}>
                {gameOptions.map(g => <option key={g.date} value={g.date}>{g.displayName}</option>)}
              </Select>
              <Toggle label="Garbage Time" value={includeGarbageTime} onChange={setIncludeGarbageTime} darkMode={darkMode} />
              <Toggle label="Losses" value={includeLosses} onChange={setIncludeLosses} darkMode={darkMode} />
              <Toggle label="High Major Only" value={highMajorOnly} onChange={setHighMajorOnly} onText="Yes" offText="No" darkMode={darkMode} />
              <Toggle label="ACC Only" value={conferenceOnly} onChange={setConferenceOnly} onText="Yes" offText="No" darkMode={darkMode} />
            </div>
          </div>

          {games === null ? (
            <div className={`flex justify-center items-center h-64 text-xl ${textMain}`}>Loading data…</div>
          ) : (
            <div className="p-6 space-y-6">
              <Warnings warnings={warnings} darkMode={darkMode} />
              <div className="grid grid-cols-1 xl:grid-cols-2 gap-6">
                <Section title="Guard Combinations" darkMode={darkMode}
                  note={hiddenGuards ? `${hiddenGuards} pair${hiddenGuards > 1 ? 's' : ''} with no minutes hidden` : null}>
                  <StatsTable rows={guardRows} columns={GUARD_COLUMNS} nameLabel="Combo" darkMode={darkMode}
                    emptyText="No data available for selected range" {...guardSort} />
                </Section>
                <Section title="Big Combinations" darkMode={darkMode}
                  note={[flexNames && `${flexNames}: counted as a big only when exactly one teammate listed below them is on the floor`, hiddenBigs && `${hiddenBigs} pairs with no minutes hidden`].filter(Boolean).join(' · ')}>
                  <StatsTable rows={bigRows} columns={BIG_COLUMNS} nameLabel="Combo" darkMode={darkMode}
                    emptyText="No data available for selected range" {...bigSort} />
                </Section>
              </div>
              <Section title="All 3-Player Combinations (5+ minutes)" darkMode={darkMode}>
                <StatsTable rows={threeRows} columns={THREE_COLUMNS} nameLabel="Combo" darkMode={darkMode}
                  emptyText="No 3-player combinations with 5+ minutes found" {...threeSort} />
              </Section>
            </div>
          )}
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<SpecificCombosViewer />);
  </script>
</body>
</html>
