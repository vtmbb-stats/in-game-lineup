<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VT Basketball Lineups</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .custom-green-100{background-color:#00A327}
    .custom-green-50{background-color:#66C47E}
    .custom-red-50{background-color:#E06060}
    .custom-red-100{background-color:#DB2800}
  </style>
  <script type="module" src="firebase.js"></script>
  <script src="config.js"></script>
  <script src="lineup-core.js"></script>
  <script src="play-log.js"></script>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
  <script type="text/babel" src="ui.jsx"></script>

  <script type="text/babel">
    const { useState, useMemo } = React;
    const C = window.LineupCore;
    const { PageHeader, RangeFilters, Card, Select, StatsTable, PlayerList, Warnings, useSort, useAvailability, useSeasonGames, collectSelected } = window.UI;

    const LineupsPage = () => {
      const [darkMode, setDarkMode] = useState(true);
      const sg = useSeasonGames();
      const [selectedPlayers, setSelectedPlayers] = useState([]);
      const [minMinutes, setMinMinutes] = useState('0');
      const sort = useSort('plusMinus');
      const { availability, toggle, isAvailable } = useAvailability();
      const roster = sg.roster;

      const { segments, warnings } = useMemo(() => collectSelected(sg), [sg.selected, sg.filters.includeGarbageTime]);
      const totals = C.playerTotals(segments);
      const allRows = C.aggregateLineups(segments.filter(s => s.lineup.every(isAvailable)), roster)
        .filter(r => selectedPlayers.every(id => r.playerIds.includes(id)));
      const rows = allRows.filter(r => r.seconds >= +minMinutes * 60 || r.hasCurrent);
      const togglePlayerFilter = (id) => setSelectedPlayers(prev => prev.includes(id) ? prev.filter(p => p !== id) : [...prev, id]);
      const textMain = darkMode ? 'text-white' : 'text-gray-900';

      return (
        <div className={`min-h-screen ${darkMode ? 'bg-gray-900' : 'bg-gray-100'}`}>
          <PageHeader title="Lineups" current="display.html" darkMode={darkMode} setDarkMode={setDarkMode}>
            <RangeFilters sg={sg} darkMode={darkMode} />
          </PageHeader>

          {sg.loading ? (
            <div className={`flex justify-center items-center h-64 text-xl ${textMain}`}>Loading games…</div>
          ) : (
            <div className="flex">
              <div className={`w-80 p-4 border-r shrink-0 ${darkMode ? 'bg-gray-800 border-gray-700' : 'bg-white border-gray-300'}`}>
                <div className="mb-6">
                  <div className="flex justify-between items-center mb-2">
                    <h3 className={`text-lg font-semibold ${textMain}`}>Lineups with…</h3>
                    {selectedPlayers.length > 0 && <button onClick={() => setSelectedPlayers([])} className="text-xs px-2 py-1 rounded bg-red-600 text-white">Clear</button>}
                  </div>
                  <div className="grid grid-cols-5 gap-1 mb-3">
                    {roster.map(p => (
                      <button key={p.id} onClick={() => togglePlayerFilter(p.id)} title={p.name}
                        className={`p-1 rounded text-xs text-center font-medium ${selectedPlayers.includes(p.id)
                          ? 'bg-blue-600 text-white'
                          : (darkMode ? 'bg-gray-700 hover:bg-gray-600 text-gray-300' : 'bg-gray-100 hover:bg-gray-200 text-gray-700')}`}>
                        #{p.id}
                      </button>
                    ))}
                  </div>
                  {selectedPlayers.length > 0 && <div className={`text-xs ${darkMode ? 'text-gray-400' : 'text-gray-600'}`}>Showing lineups with: {selectedPlayers.map(id => C.lastName(id, roster)).join(', ')}</div>}
                </div>
                <PlayerList players={roster} totals={totals} availability={availability} onToggle={toggle} darkMode={darkMode} />
              </div>

              <div className="flex-1 p-4 min-w-0">
                <Warnings warnings={warnings} darkMode={darkMode} />
                <Card darkMode={darkMode} title="Five-man lineups"
                  right={<div className="flex items-center gap-3">
                    <span>{rows.length} of {allRows.length} lineups</span>
                    <Select label="Min. minutes" value={minMinutes} onChange={setMinMinutes} darkMode={darkMode}>
                      {['0', '1', '2', '5', '10', '20'].map(m => <option key={m} value={m}>{m}</option>)}
                    </Select>
                  </div>}>
                  <StatsTable rows={rows} darkMode={darkMode} {...sort}
                    emptyText={sg.selected.length === 0 ? 'No tracked games match these filters' : 'No lineups match these filters'} />
                </Card>
              </div>
            </div>
          )}
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<LineupsPage />);
  </script>
</body>
</html>
